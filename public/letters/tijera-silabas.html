<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <title>Corta las Sílabas – Juegos de Letras</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0f0f1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: 'Arial Rounded MT Bold', Arial, sans-serif;
      overflow-y: auto;
      overflow-x: hidden;
      user-select: none;
    }

    canvas#bg {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%; z-index: 0;
    }

    #game {
      position: relative; z-index: 1;
      display: flex; flex-direction: column;
      align-items: center; gap: 16px;
      padding: 20px; width: 100%;
    }

    /* ── Top bar ── */
    #topbar {
      display: flex; align-items: center;
      gap: 20px; width: 100%; max-width: 680px;
    }
    .home-btn {
      text-decoration: none;
      background: rgba(255,255,255,0.08);
      border: 2px solid rgba(255,255,255,0.15);
      border-radius: 50%;
      width: 46px; height: 46px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem;
      transition: border-color 0.15s, background 0.15s;
    }
    .home-btn:hover { border-color: #FFD700; background: rgba(255,215,0,0.1); }
    .page-title {
      color: #FFD700; font-size: 26px;
      text-shadow: 0 0 20px rgba(255,215,0,0.4), 2px 2px 0 #b8860b;
      letter-spacing: 2px;
    }

    /* ── HUD ── */
    #hud { display: flex; gap: 40px; align-items: center; }
    .hud-box { text-align: center; }
    .hud-label { color: #64748b; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; }
    .hud-value { color: #FFD700; font-size: 30px; font-weight: bold; text-shadow: 0 0 18px rgba(255,215,0,0.5); }

    /* ── Hint card ── */
    #hint-card {
      background: rgba(255,255,255,0.06);
      border: 2px solid rgba(255,255,255,0.12);
      border-radius: 24px;
      padding: 12px 40px;
      display: flex; flex-direction: column;
      align-items: center; gap: 4px;
    }
    #hint-emoji { font-size: 3.6rem; line-height: 1; }
    #hint-card-label { color: #64748b; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; }

    /* ── Message ── */
    #message {
      color: #e2e8f0; font-size: 18px; letter-spacing: 1px;
      min-height: 28px; text-align: center;
    }
    #message.correct { color: #22c55e; text-shadow: 0 0 12px rgba(34,197,94,0.5); }
    #message.wrong   { color: #ef4444; text-shadow: 0 0 12px rgba(239,68,68,0.5); }

    /* ── Word with scissor cut-points ── */
    #word-row {
      display: flex; align-items: center; justify-content: center;
      flex-wrap: wrap; gap: 0;
      max-width: 700px;
    }

    .letter {
      width: 62px; height: 72px;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.1rem; font-weight: bold; color: #FFD700;
      background: rgba(255,255,255,0.06);
      border: 2px solid rgba(255,255,255,0.14);
      border-radius: 10px;
      transition: background 0.2s, border-color 0.2s;
    }
    .letter.in-syllable-alt { background: rgba(255,215,0,0.12); }

    /* ── Syllable group colors (shown after a correct cut) ── */
    .letter.syl-0 { background: rgba(239,68,68,0.22);  border-color: #ef4444; color: #fecaca; }
    .letter.syl-1 { background: rgba(59,130,246,0.22); border-color: #3b82f6; color: #bfdbfe; }
    .letter.syl-2 { background: rgba(34,197,94,0.22);  border-color: #22c55e; color: #bbf7d0; }
    .letter.syl-3 { background: rgba(234,179,8,0.22);  border-color: #eab308; color: #fef08a; }
    .letter.syl-4 { background: rgba(168,85,247,0.22); border-color: #a855f7; color: #e9d5ff; }
    .letter.syl-5 { background: rgba(236,72,153,0.22); border-color: #ec4899; color: #fbcfe8; }

    .cut-slot {
      width: 34px; height: 72px;
      display: flex; align-items: center; justify-content: center;
      position: relative;
      cursor: pointer;
    }
    .cut-slot .line {
      width: 3px; height: 50px;
      background: rgba(255,255,255,0.15);
      border-radius: 2px;
      transition: background 0.15s, width 0.15s;
    }
    .cut-slot .scissors {
      position: absolute;
      font-size: 1.3rem;
      opacity: 0.35;
      transform: rotate(90deg);
      transition: opacity 0.15s, transform 0.15s;
      pointer-events: none;
    }
    .cut-slot:hover .scissors { opacity: 0.8; }
    .cut-slot.cut .line { background: #FFD700; width: 4px; box-shadow: 0 0 10px rgba(255,215,0,0.6); }
    .cut-slot.cut .scissors { opacity: 1; transform: rotate(0deg); }

    .cut-slot.correct .line { background: #22c55e; box-shadow: 0 0 10px rgba(34,197,94,0.6); }
    .cut-slot.correct .scissors { opacity: 1; transform: rotate(0deg); }
    .cut-slot.missing .line { background: #ef4444; box-shadow: 0 0 10px rgba(239,68,68,0.6); }
    .cut-slot.extra .line { background: #ef4444; box-shadow: 0 0 10px rgba(239,68,68,0.6); }

    /* ── Buttons ── */
    .btn {
      padding: 12px 36px;
      font-size: 1.1rem; font-family: inherit; font-weight: bold;
      color: #1a1a1a;
      background: linear-gradient(90deg, #FFD700, #F59E0B);
      border: none; border-radius: 50px; cursor: pointer;
      box-shadow: 0 5px 20px rgba(255,215,0,0.35);
      transition: transform 0.12s;
    }
    .btn:hover { transform: scale(1.07); }
    .btn:disabled { opacity: 0.4; cursor: default; transform: none; }

    #next-btn { display: none; }

    #controls { display: flex; gap: 16px; }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>

  <div id="game">
    <div id="topbar">
      <a class="home-btn" href="index.html">🏠</a>
      <span class="page-title">✂️ CORTA LAS SÍLABAS</span>
    </div>

    <div id="hud">
      <div class="hud-box"><div class="hud-label">Puntos</div><div class="hud-value" id="score">0</div></div>
      <div class="hud-box"><div class="hud-label">Palabra</div><div class="hud-value" id="word-num">1</div></div>
    </div>

    <div id="hint-card">
      <div id="hint-emoji">🐱</div>
      <div id="hint-card-label">¡USA LA TIJERA PARA SEPARAR LAS SÍLABAS!</div>
    </div>

    <div id="message">¡HAZ CLIC ENTRE LAS LETRAS PARA CORTAR LA PALABRA!</div>
    <div id="word-row"></div>

    <div id="controls">
      <button class="btn" id="check-btn" onclick="checkCuts()">✂️ VERIFICAR CORTE</button>
      <button class="btn" id="next-btn" onclick="nextWord()">SIGUIENTE PALABRA ➡️</button>
    </div>
  </div>

  <script>
    /* ── Starfield ── */
    const canvas=document.getElementById('bg'), ctx=canvas.getContext('2d');
    function resize(){canvas.width=innerWidth;canvas.height=innerHeight;}
    resize(); window.addEventListener('resize',resize);
    const stars=Array.from({length:160},()=>({x:Math.random(),y:Math.random(),r:.5+Math.random()*1.5,speed:.00008+Math.random()*.00015,twinkle:Math.random()*Math.PI*2}));
    const floaters='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(c=>({text:c,x:Math.random(),y:Math.random(),speed:.0001+Math.random()*.0002,size:14+Math.random()*18,alpha:.03+Math.random()*.06}));
    function drawBg(){
      const W=canvas.width,H=canvas.height;
      ctx.fillStyle='#0f0f1a';ctx.fillRect(0,0,W,H);
      for(const s of stars){s.twinkle+=s.speed*60;ctx.globalAlpha=.4+Math.sin(s.twinkle)*.4;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);ctx.fill();}
      for(const f of floaters){f.y-=f.speed;if(f.y<-.05)f.y=1.05;ctx.globalAlpha=f.alpha;ctx.fillStyle='#FFD700';ctx.font=`bold ${f.size}px Arial`;ctx.textAlign='center';ctx.fillText(f.text,f.x*W,f.y*H);}
      ctx.globalAlpha=1;requestAnimationFrame(drawBg);
    }
    drawBg();

    /* ── Word list: word split into syllables ── */
    const WORDS=[
      {syllables:['GA','TO'],      emoji:'🐱'},
      {syllables:['PA','TO'],      emoji:'🦆'},
      {syllables:['CA','SA'],      emoji:'🏠'},
      {syllables:['LU','NA'],      emoji:'🌙'},
      {syllables:['MA','NO'],      emoji:'✋'},
      {syllables:['PE','LO','TA'], emoji:'⚽'},
      {syllables:['TO','MA','TE'], emoji:'🍅'},
      {syllables:['ES','TRE','LLA'], emoji:'⭐'},
      {syllables:['CO','CI','NA'],  emoji:'🍳'},
      {syllables:['ZA','PA','TO'],  emoji:'👟'},
      {syllables:['CA','BA','LLO'], emoji:'🐴'},
      {syllables:['MON','TA','ÑA'], emoji:'⛰️'},
      {syllables:['VEN','TA','NA'], emoji:'🪟'},
      {syllables:['MA','RI','PO','SA'], emoji:'🦋'},
      {syllables:['HE','LA','DO'],  emoji:'🍦'},
      {syllables:['PLA','TA','NO'], emoji:'🍌'},
      {syllables:['BI','CI','CLE','TA'], emoji:'🚲'},
      {syllables:['CO','CO','DRI','LO'], emoji:'🐊'},
      {syllables:['DEL','FÍN'],     emoji:'🐬'},
      {syllables:['A','RA','ÑA'],   emoji:'🕷️'},
    ];

    /* ── Group words by syllable count so difficulty ramps up gradually ── */
    const WORDS_BY_COUNT={};
    WORDS.forEach(w=>{
      const n=w.syllables.length;
      (WORDS_BY_COUNT[n]=WORDS_BY_COUNT[n]||[]).push(w);
    });
    const SYLLABLE_COUNTS=Object.keys(WORDS_BY_COUNT).map(Number).sort((a,b)=>a-b);

    let score=0, wordNum=1, current=null, correctCuts=[], cutSet=new Set(), locked=false;
    const usedIdxByCount={};

    /* ── Difficulty curve: 2 sílabas al empezar, sumando más cada pocas palabras ── */
    function difficultyFor(num){
      const step=3; // cada 3 palabras sube de nivel
      const level=Math.floor((num-1)/step);
      const idx=Math.min(level, SYLLABLE_COUNTS.length-1);
      return SYLLABLE_COUNTS[idx];
    }

    function pickWord(){
      const count=difficultyFor(wordNum);
      const pool=WORDS_BY_COUNT[count];
      const used=usedIdxByCount[count]=usedIdxByCount[count]||[];
      if(used.length>=pool.length) used.length=0;
      let idx;
      do { idx=Math.floor(Math.random()*pool.length); } while(used.includes(idx));
      used.push(idx);
      return pool[idx];
    }

    function buildGame(){
      current=pickWord();
      const letters=current.syllables.join('').split('');
      /* cut indices are positions AFTER each syllable except the last */
      correctCuts=[];
      let pos=0;
      for(let i=0;i<current.syllables.length-1;i++){
        pos+=current.syllables[i].length;
        correctCuts.push(pos);
      }
      cutSet=new Set();
      locked=false;
      document.getElementById('hint-emoji').textContent=current.emoji;
      document.getElementById('next-btn').style.display='none';
      document.getElementById('check-btn').disabled=false;
      setMessage('¡HAZ CLIC ENTRE LAS LETRAS PARA CORTAR LA PALABRA!','');

      /* which syllable group each letter belongs to (for end-of-round coloring) */
      let sylIdx=0, boundaryPtr=0;
      const letterSyl=letters.map((_,i)=>{
        if(boundaryPtr<correctCuts.length && i===correctCuts[boundaryPtr]){ sylIdx++; boundaryPtr++; }
        return sylIdx;
      });

      const row=document.getElementById('word-row');
      row.innerHTML='';
      letters.forEach((ch,i)=>{
        const letterEl=document.createElement('div');
        letterEl.className='letter';
        letterEl.textContent=ch;
        letterEl.dataset.syl=letterSyl[i];
        row.appendChild(letterEl);

        if(i<letters.length-1){
          const slot=document.createElement('div');
          slot.className='cut-slot';
          slot.dataset.pos=i+1;
          slot.innerHTML='<div class="scissors">✂️</div><div class="line"></div>';
          slot.addEventListener('click',()=>{
            if(locked) return;
            const p=parseInt(slot.dataset.pos);
            if(cutSet.has(p)){ cutSet.delete(p); slot.classList.remove('cut'); }
            else { cutSet.add(p); slot.classList.add('cut'); }
          });
          row.appendChild(slot);
        }
      });
    }

    function checkCuts(){
      if(locked) return;
      const slots=document.querySelectorAll('.cut-slot');
      const correctSet=new Set(correctCuts);
      let allMatch = cutSet.size===correctSet.size && [...cutSet].every(p=>correctSet.has(p));

      slots.forEach(slot=>{
        const p=parseInt(slot.dataset.pos);
        slot.classList.remove('correct','missing','extra');
        const hasCut=cutSet.has(p), shouldCut=correctSet.has(p);
        if(hasCut && shouldCut) slot.classList.add('correct');
        else if(!hasCut && shouldCut) slot.classList.add('missing');
        else if(hasCut && !shouldCut) slot.classList.add('extra');
      });

      if(allMatch){
        locked=true;
        score+=20; document.getElementById('score').textContent=score;
        setMessage('⭐ ¡CORRECTO! ¡MUY BIEN CORTADO!','correct');
        document.getElementById('check-btn').disabled=true;
        document.getElementById('next-btn').style.display='inline-block';
        document.querySelectorAll('.letter').forEach(letterEl=>{
          letterEl.classList.add('syl-'+letterEl.dataset.syl);
        });
      } else {
        setMessage('❌ ¡CASI! MIRA LOS CORTES EN ROJO Y VUELVE A INTENTARLO','wrong');
        setTimeout(()=>{
          slots.forEach(slot=>slot.classList.remove('missing','extra'));
          setMessage('¡HAZ CLIC ENTRE LAS LETRAS PARA CORTAR LA PALABRA!','');
        }, 1400);
      }
    }

    function nextWord(){
      wordNum++; document.getElementById('word-num').textContent=wordNum;
      buildGame();
    }

    function setMessage(text,cls){
      const el=document.getElementById('message');
      el.textContent=text; el.className=cls;
    }

    buildGame();
  </script>
</body>
</html>
