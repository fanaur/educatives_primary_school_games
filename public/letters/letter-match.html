<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <title>Empareja las Letras – Juegos de Letras</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0f0f1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: 'Arial Rounded MT Bold', Arial, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    canvas#bg {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%; z-index: 0;
    }

    #game {
      position: relative; z-index: 1;
      display: flex; flex-direction: column;
      align-items: center; gap: 20px;
      padding: 20px;
      width: 100%;
    }

    /* ── Top bar ── */
    #topbar {
      display: flex; align-items: center;
      gap: 20px; width: 100%; max-width: 680px;
    }

    .home-btn {
      text-decoration: none;
      background: rgba(255,255,255,0.08);
      border: 2px solid rgba(255,255,255,0.15);
      border-radius: 50%;
      width: 46px; height: 46px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem;
      transition: border-color 0.15s, background 0.15s;
    }
    .home-btn:hover { border-color: #FFD700; background: rgba(255,215,0,0.1); }

    .page-title {
      color: #FFD700;
      font-size: 28px;
      text-shadow: 0 0 20px rgba(255,215,0,0.4), 2px 2px 0 #b8860b;
      letter-spacing: 3px;
    }

    /* ── HUD ── */
    #hud {
      display: flex; gap: 40px; align-items: center;
    }
    .hud-box { text-align: center; }
    .hud-label {
      color: #64748b; font-size: 11px;
      letter-spacing: 2px; text-transform: uppercase;
    }
    .hud-value {
      color: #FFD700; font-size: 30px; font-weight: bold;
      text-shadow: 0 0 18px rgba(255,215,0,0.5);
    }

    /* ── Message ── */
    #message {
      color: #e2e8f0; font-size: 18px;
      letter-spacing: 1px; min-height: 28px;
      text-align: center;
    }
    #message.correct { color: #22c55e; text-shadow: 0 0 12px rgba(34,197,94,0.5); }
    #message.wrong   { color: #ef4444; text-shadow: 0 0 12px rgba(239,68,68,0.5); }

    /* ── Card grid ── */
    #board {
      display: grid;
      grid-template-columns: repeat(5, 100px);
      gap: 10px;
      justify-content: center;
    }

    .card {
      width: 100px; height: 100px;
      perspective: 600px;
      cursor: pointer;
    }

    .card-inner {
      width: 100%; height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.4s ease;
      border-radius: 18px;
    }
    .card.flipped .card-inner,
    .card.matched .card-inner { transform: rotateY(180deg); }

    .card-front, .card-back {
      position: absolute; width: 100%; height: 100%;
      backface-visibility: hidden;
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.8rem; font-weight: bold;
    }

    .card-front {
      background: rgba(255,255,255,0.06);
      border: 2px solid rgba(255,255,255,0.12);
      color: #FFD700;
      font-size: 2.6rem;
      transition: border-color 0.15s;
    }
    .card:hover .card-front {
      border-color: rgba(255,215,0,0.4);
      background: rgba(255,215,0,0.07);
    }

    .card-back {
      transform: rotateY(180deg);
      background: rgba(255,255,255,0.08);
      border: 2px solid rgba(255,255,255,0.18);
    }
    .card.uppercase .card-back { color: #F59E0B; font-size: 2.6rem; }
    .card.lowercase .card-back { color: #60a5fa; font-size: 2.6rem; }

    .card.matched .card-front { background: rgba(34,197,94,0.15); border-color: #22c55e; }
    .card.matched .card-back  { background: rgba(34,197,94,0.15); border-color: #22c55e; }

    /* ── Next button ── */
    #next-btn {
      display: none;
      padding: 12px 36px;
      font-size: 1.2rem; font-family: inherit;
      background: linear-gradient(90deg, #FFD700, #F59E0B);
      color: #1a1a1a; border: none;
      border-radius: 50px; cursor: pointer; font-weight: bold;
      box-shadow: 0 5px 20px rgba(255,215,0,0.35);
      transition: transform 0.12s;
    }
    #next-btn:hover { transform: scale(1.07); }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>

  <div id="game">
    <div id="topbar">
      <a class="home-btn" href="index.html">🏠</a>
      <span class="page-title">🃏 EMPAREJA LAS LETRAS</span>
    </div>

    <div id="hud">
      <div class="hud-box">
        <div class="hud-label">Puntos</div>
        <div class="hud-value" id="score">0</div>
      </div>
      <div class="hud-box">
        <div class="hud-label">Ronda</div>
        <div class="hud-value" id="round">1</div>
      </div>
      <div class="hud-box">
        <div class="hud-label">Pares</div>
        <div class="hud-value" id="pairs">0 / 4</div>
      </div>
    </div>

    <div id="message">¡VOLTEA LAS CARTAS Y ENCUENTRA LOS PARES!</div>
    <div id="board"></div>
    <button id="next-btn" onclick="nextRound()">SIGUIENTE RONDA ➡️</button>
  </div>

  <script>
    /* ── Starfield ── */
    const canvas = document.getElementById('bg');
    const ctx    = canvas.getContext('2d');
    function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
    resize(); window.addEventListener('resize', resize);
    const stars = Array.from({length:160},()=>({x:Math.random(),y:Math.random(),r:.5+Math.random()*1.5,speed:.00008+Math.random()*.00015,twinkle:Math.random()*Math.PI*2}));
    const floaters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').slice(0,20).map(c=>({text:c,x:Math.random(),y:Math.random(),speed:.0001+Math.random()*.0002,size:14+Math.random()*18,alpha:.03+Math.random()*.06}));
    function drawBg(){
      const W=canvas.width,H=canvas.height;
      ctx.fillStyle='#0f0f1a'; ctx.fillRect(0,0,W,H);
      for(const s of stars){s.twinkle+=s.speed*60;ctx.globalAlpha=.4+Math.sin(s.twinkle)*.4;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);ctx.fill();}
      for(const f of floaters){f.y-=f.speed;if(f.y<-.05)f.y=1.05;ctx.globalAlpha=f.alpha;ctx.fillStyle='#FFD700';ctx.font=`bold ${f.size}px Arial`;ctx.textAlign='center';ctx.fillText(f.text,f.x*W,f.y*H);}
      ctx.globalAlpha=1; requestAnimationFrame(drawBg);
    }
    drawBg();

    /* ── Game logic ── */
    const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
    let score=0, round=1, matchedCount=0;
    let firstCard=null, lockBoard=false;

    function buildBoard(){
      const board = document.getElementById('board');
      board.innerHTML=''; firstCard=null; lockBoard=false; matchedCount=0;
      setMessage('¡VOLTEA LAS CARTAS Y ENCUENTRA LOS PARES!','');
      document.getElementById('next-btn').style.display='none';
      document.getElementById('pairs').textContent='0 / 10';

      const letters = [...LETTERS].sort(()=>Math.random()-.5).slice(0,10);
      const cards=[];
      letters.forEach(l=>{ cards.push({letter:l,type:'uppercase'}); cards.push({letter:l,type:'lowercase'}); });
      cards.sort(()=>Math.random()-.5);

      cards.forEach(({letter,type})=>{
        const card=document.createElement('div');
        card.className=`card ${type}`;
        card.dataset.letter=letter; card.dataset.type=type;
        card.innerHTML=`<div class="card-inner"><div class="card-front">?</div><div class="card-back">${type==='uppercase'?letter:letter.toLowerCase()}</div></div>`;
        card.addEventListener('click',()=>flipCard(card));
        board.appendChild(card);
      });
    }

    function flipCard(card){
      if(lockBoard||card.classList.contains('flipped')||card.classList.contains('matched')) return;
      card.classList.add('flipped');
      if(!firstCard){ firstCard=card; return; }

      lockBoard=true;
      const second=card;
      if(firstCard.dataset.letter===second.dataset.letter && firstCard.dataset.type!==second.dataset.type){
        firstCard.classList.add('matched'); second.classList.add('matched');
        score+=10; matchedCount++;
        document.getElementById('score').textContent=score;
        document.getElementById('pairs').textContent=`${matchedCount} / 10`;
        firstCard=null; lockBoard=false;
        setMessage('⭐ ¡PAR! ¡MUY BIEN!','correct');
        if(matchedCount===10){
          setMessage('🏆 ¡RONDA COMPLETA! ¡INCREÍBLE!','correct');
          document.getElementById('next-btn').style.display='inline-block';
        }
      } else {
        setMessage('❌ ¡INTENTA DE NUEVO!','wrong');
        setTimeout(()=>{
          firstCard.classList.remove('flipped'); second.classList.remove('flipped');
          firstCard=null; lockBoard=false;
          setMessage('¡VOLTEA LAS CARTAS Y ENCUENTRA LOS PARES!','');
        },1000);
      }
    }

    function setMessage(text, cls){
      const el=document.getElementById('message');
      el.textContent=text; el.className=cls;
    }

    function nextRound(){
      round++; document.getElementById('round').textContent=round;
      buildBoard();
    }

    buildBoard();
  </script>
</body>
</html>
