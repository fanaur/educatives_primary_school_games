<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <title>¡Revienta las Burbujas! – Juegos de Letras</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0f0f1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: 'Arial Rounded MT Bold', Arial, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    canvas#bg {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%; z-index: 0;
    }

    #game {
      position: relative; z-index: 1;
      display: flex; flex-direction: column;
      align-items: center; gap: 16px;
      padding: 20px; width: 100%;
    }

    /* ── Top bar ── */
    #topbar {
      display: flex; align-items: center;
      gap: 20px; width: 100%; max-width: 700px;
    }
    .home-btn {
      text-decoration: none;
      background: rgba(255,255,255,0.08);
      border: 2px solid rgba(255,255,255,0.15);
      border-radius: 50%;
      width: 46px; height: 46px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem;
      transition: border-color 0.15s, background 0.15s;
    }
    .home-btn:hover { border-color: #FFD700; background: rgba(255,215,0,0.1); }
    .page-title {
      color: #FFD700; font-size: 28px;
      text-shadow: 0 0 20px rgba(255,215,0,0.4), 2px 2px 0 #b8860b;
      letter-spacing: 3px;
    }

    /* ── HUD ── */
    #hud { display: flex; gap: 40px; align-items: center; }
    .hud-box { text-align: center; }
    .hud-label { color: #64748b; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; }
    .hud-value { color: #FFD700; font-size: 30px; font-weight: bold; text-shadow: 0 0 18px rgba(255,215,0,0.5); }

    /* ── Prompt card ── */
    #prompt-card {
      background: rgba(255,255,255,0.06);
      border: 2px solid rgba(255,255,255,0.18);
      border-radius: 24px;
      padding: 14px 50px;
      display: flex; align-items: center; justify-content: center;
    }

    .prompt-half {
      display: flex; flex-direction: column;
      align-items: center; gap: 4px;
    }
    .prompt-case-label {
      color: #64748b; font-size: 11px;
      letter-spacing: 2px; text-transform: uppercase;
    }
    .prompt-big {
      font-size: 5rem; font-weight: bold; line-height: 1;
    }
    #prompt-upper { color: #F59E0B; text-shadow: 0 0 24px rgba(245,158,11,0.6); }

    /* ── Message ── */
    #message {
      color: #e2e8f0; font-size: 17px; letter-spacing: 1px;
      min-height: 26px; text-align: center;
    }
    #message.correct { color: #22c55e; text-shadow: 0 0 12px rgba(34,197,94,0.5); }
    #message.wrong   { color: #ef4444; text-shadow: 0 0 12px rgba(239,68,68,0.5); }

    /* ── Arena ── */
    #arena {
      position: relative;
      width: min(680px, 95vw);
      height: 360px;
      border-radius: 24px;
      background: rgba(255,255,255,0.03);
      border: 2px solid rgba(255,255,255,0.08);
      overflow: hidden;
    }

    .bubble {
      position: absolute;
      bottom: -120px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: bold; cursor: pointer;
      animation: rise linear forwards;
      transition: transform 0.1s;
    }
    .bubble:hover { transform: scale(1.1); }

    @keyframes rise {
      from { bottom: -120px; }
      to   { bottom: 110%; }
    }
    @keyframes pop {
      0%   { transform: scale(1);   opacity: 1; }
      50%  { transform: scale(1.8); opacity: 0.5; }
      100% { transform: scale(0);   opacity: 0; }
    }
    .bubble.popping { animation: pop 0.3s ease forwards !important; }

    /* ── Overlay screens ── */
    .overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 18px;
      background: rgba(0,0,0,0.68);
      border-radius: 24px; z-index: 10;
    }
    .overlay p { color: #cbd5e1; font-size: 1.05rem; text-align: center; max-width: 320px; letter-spacing: 1px; line-height: 1.6; }
    .overlay .big-score { font-size: 3rem; color: #FFD700; text-shadow: 0 0 24px rgba(255,215,0,0.6); }

    .play-btn {
      padding: 12px 40px;
      font-size: 1.2rem; font-family: inherit; font-weight: bold;
      background: linear-gradient(90deg, #FFD700, #F59E0B);
      color: #1a1a1a; border: none;
      border-radius: 50px; cursor: pointer;
      box-shadow: 0 5px 20px rgba(255,215,0,0.4);
      transition: transform 0.12s;
    }
    .play-btn:hover { transform: scale(1.07); }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>

  <div id="game">
    <div id="topbar">
      <a class="home-btn" href="index.html">🏠</a>
      <span class="page-title">🫧 REVIENTA LAS BURBUJAS</span>
    </div>

    <div id="hud">
      <div class="hud-box"><div class="hud-label">Puntos</div><div class="hud-value" id="score">0</div></div>
      <div class="hud-box"><div class="hud-label">Nivel</div><div class="hud-value" id="level">1</div></div>
    </div>

    <!-- Muestra la MAYÚSCULA — el niño busca su MINÚSCULA en el globo -->
    <div id="prompt-card">
      <div class="prompt-half">
        <span class="prompt-case-label">Busca la minúscula de:</span>
        <span class="prompt-big" id="prompt-upper">A</span>
      </div>
    </div>

    <div id="message">¡REVIENTA EL GLOBO CON LA LETRA MINÚSCULA!</div>

    <div id="arena">
      <div class="overlay" id="start-screen">
        <p>VE LA LETRA MAYÚSCULA Y REVIENTA EL GLOBO CON SU MINÚSCULA 🎯</p>
        <p style="font-size:2rem">
          <span style="color:#F59E0B">A</span>
          <span style="color:#FFD700;margin:0 10px">➜</span>
          <span style="color:#60a5fa">a</span>
        </p>
        <button class="play-btn" onclick="startGame()">▶ ¡JUGAR!</button>
      </div>
    </div>
  </div>

  <script>
    /* ── Starfield ── */
    const canvas=document.getElementById('bg'), ctx=canvas.getContext('2d');
    function resize(){canvas.width=innerWidth;canvas.height=innerHeight;}
    resize(); window.addEventListener('resize',resize);
    const stars=Array.from({length:160},()=>({x:Math.random(),y:Math.random(),r:.5+Math.random()*1.5,speed:.00008+Math.random()*.00015,twinkle:Math.random()*Math.PI*2}));
    const floaters='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz'.split('').map(c=>({text:c,x:Math.random(),y:Math.random(),speed:.0001+Math.random()*.0002,size:12+Math.random()*16,alpha:.03+Math.random()*.05}));
    function drawBg(){
      const W=canvas.width,H=canvas.height;
      ctx.fillStyle='#0f0f1a';ctx.fillRect(0,0,W,H);
      for(const s of stars){s.twinkle+=s.speed*60;ctx.globalAlpha=.4+Math.sin(s.twinkle)*.4;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);ctx.fill();}
      for(const f of floaters){f.y-=f.speed;if(f.y<-.05)f.y=1.05;ctx.globalAlpha=f.alpha;ctx.fillStyle='#FFD700';ctx.font=`bold ${f.size}px Arial`;ctx.textAlign='center';ctx.fillText(f.text,f.x*W,f.y*H);}
      ctx.globalAlpha=1;requestAnimationFrame(drawBg);
    }
    drawBg();

    /* ── Game ── */
    const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
    const BUBBLE_COLORS=[
      ['#6b9dff','#1a4fd8'],['#ff6b9d','#d8194e'],['#6bff9d','#19d857'],
      ['#ffd76b','#d8a019'],['#d76bff','#9b19d8'],['#ff9d6b','#d85a19'],
      ['#6bffff','#19b8d8'],['#ff6bff','#d819d8'],
    ];
    const SIZES=[84,98,110,122];

    let score=0, level=1, targetUpper='';
    let bubbles=[], spawnTimer=null, spawnInterval=1800, running=false;

    function startGame(){
      document.getElementById('start-screen').style.display='none';
      score=0; level=1; spawnInterval=1800;
      updateHUD(); running=true;
      nextTarget(); scheduleSpawn();
    }

    function restartGame(){ clearAllBubbles(); startGame(); }

    function nextTarget(){
      targetUpper = LETTERS[Math.floor(Math.random()*LETTERS.length)];
      document.getElementById('prompt-upper').textContent = targetUpper;
    }

    function scheduleSpawn(){
      if(!running) return;
      spawnBubble();
      spawnTimer = setTimeout(scheduleSpawn, spawnInterval);
    }

    function spawnBubble(){
      const arena = document.getElementById('arena');
      // ~45% chance it's the correct lowercase letter
      const isTarget = Math.random() < 0.45;
      const letter = isTarget
        ? targetUpper.toLowerCase()
        : randomWrongLower();

      const size  = SIZES[Math.floor(Math.random()*SIZES.length)];
      const [c1,c2] = BUBBLE_COLORS[Math.floor(Math.random()*BUBBLE_COLORS.length)];
      const maxX  = arena.clientWidth - size - 10;
      const left  = 10 + Math.random()*maxX;
      const dur   = Math.max(2.2, 5.5-(level-1)*0.4);

      const el = document.createElement('div');
      el.className = 'bubble';
      el.textContent = letter;
      el.style.cssText=`
        width:${size}px;height:${size}px;
        font-size:${size*.44}px;
        left:${left}px;
        background:radial-gradient(circle at 35% 35%, ${c1}, ${c2});
        box-shadow:0 0 22px ${c1}88, inset 0 0 12px rgba(255,255,255,0.25);
        color:white;
        text-shadow:1px 1px 4px rgba(0,0,0,0.5);
        animation-duration:${dur}s;
      `;
      el.addEventListener('click', ()=>onBubbleClick(el, letter));
      arena.appendChild(el);
      bubbles.push(el);

      el.addEventListener('animationend', ()=>{
        if(!el.classList.contains('popping') && running){
          if(letter === targetUpper.toLowerCase()) setMessage('¡SE ESCAPÓ! ❌','wrong');
          removeBubble(el);
        }
      });
    }

    function randomWrongLower(){
      let l;
      do { l = LETTERS[Math.floor(Math.random()*LETTERS.length)].toLowerCase(); }
      while(l === targetUpper.toLowerCase());
      return l;
    }

    function onBubbleClick(el, letter){
      if(el.classList.contains('popping')) return;
      el.classList.add('popping');

      if(letter === targetUpper.toLowerCase()){
        score += 10*level; updateHUD();
        setMessage('⭐ ¡POP! ¡MUY BIEN!','correct');
        if(score > 0 && score%(50*level)===0){
          level++; spawnInterval=Math.max(800,spawnInterval-200);
          clearTimeout(spawnTimer); scheduleSpawn();
          setMessage(`⬆️ ¡NIVEL ${level}! ¡MÁS RÁPIDO!`,'correct');
        }
        setTimeout(()=>{ removeBubble(el); nextTarget(); setMessage('¡REVIENTA EL GLOBO CON LA LETRA MINÚSCULA!',''); }, 320);
      } else {
        setMessage(`ESA ES "${letter}" — ¡BUSCA "${targetUpper.toLowerCase()}"!`,'wrong');
        setTimeout(()=>removeBubble(el), 320);
      }
    }

    function updateHUD(){
      document.getElementById('score').textContent = score;
      document.getElementById('level').textContent = level;
    }

    function setMessage(text,cls){
      const el=document.getElementById('message');
      el.textContent=text; el.className=cls;
    }

    function removeBubble(el){ el.remove(); bubbles=bubbles.filter(b=>b!==el); }

    function clearAllBubbles(){
      bubbles.forEach(b=>b.remove()); bubbles=[];
      clearTimeout(spawnTimer);
    }

  </script>
</body>
</html>
