<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sube la Escalera – MicaGames</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      background:#0f0f1a;
      min-height:100vh;
      display:flex; flex-direction:column; align-items:center;
      font-family:'Arial Rounded MT Bold', Arial, sans-serif;
      overflow-y:auto; overflow-x:hidden;
      user-select:none;
    }

    canvas#bg { position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; }
    .confetti-layer { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:50; }

    #game {
      position:relative; z-index:1;
      display:flex; flex-direction:column;
      align-items:center; gap:18px;
      padding:20px 16px 36px;
      width:100%; max-width:640px;
    }

    /* ── Top bar ── */
    #topbar { display:flex; align-items:center; gap:14px; width:100%; }
    .home-btn {
      text-decoration:none;
      background:rgba(255,255,255,0.08);
      border:2px solid rgba(255,255,255,0.15);
      border-radius:50%; width:44px; height:44px;
      display:flex; align-items:center; justify-content:center; font-size:1.3rem;
      transition:border-color .15s, background .15s;
    }
    .home-btn:hover { border-color:#FFD700; background:rgba(255,215,0,.1); }
    .page-title {
      color:#FFD700; font-size:20px;
      text-shadow:0 0 20px rgba(255,215,0,.4), 2px 2px 0 #b8860b;
      letter-spacing:1px;
    }

    /* ── HUD ── */
    #hud { display:flex; gap:28px; align-items:center; }
    .hud-box { text-align:center; }
    .hud-label { color:#64748b; font-size:11px; letter-spacing:2px; text-transform:uppercase; }
    .hud-value { color:#FFD700; font-size:26px; font-weight:bold; text-shadow:0 0 14px rgba(255,215,0,.4); }

    #level-badge {
      background:rgba(255,215,0,.1); border:2px solid rgba(255,215,0,.3);
      color:#FFD700; font-size:13px; letter-spacing:2px;
      padding:5px 16px; border-radius:20px;
    }

    /* ── Prompt card ── */
    #prompt-card {
      width:100%;
      background:rgba(255,255,255,.05);
      border:2px solid rgba(255,255,255,.1);
      border-radius:24px;
      padding:18px 16px;
      display:flex; flex-direction:column;
      align-items:center; gap:6px;
      transition:border-color .3s, box-shadow .3s;
    }
    #prompt-card.correct { border-color:#22c55e; box-shadow:0 0 36px rgba(34,197,94,.25); }
    #prompt-card.wrong   { border-color:#ef4444; box-shadow:0 0 36px rgba(239,68,68,.2); }

    #prompt-text {
      font-size:15px; color:#e2e8f0; text-align:center; line-height:1.6;
    }
    #prompt-text b { color:#FFD700; }

    #equation {
      font-size:1.8rem; font-weight:bold; letter-spacing:2px; color:#e2e8f0;
      margin-top:4px;
    }
    #equation .blank {
      display:inline-flex; align-items:center; justify-content:center;
      min-width:48px; height:48px; padding:0 8px;
      background:rgba(255,215,0,.1); border:3px dashed rgba(255,215,0,.5);
      border-radius:12px; color:#FFD700; vertical-align:middle;
      animation:pulseBlank 1.1s ease-in-out infinite;
    }
    @keyframes pulseBlank {
      0%,100%{ box-shadow:0 0 0 0 rgba(255,215,0,.3); }
      50%    { box-shadow:0 0 0 10px rgba(255,215,0,0); }
    }
    #equation .blank.filled { animation:none; }
    #equation .blank.correct-fill { background:rgba(34,197,94,.25); border-color:#22c55e; color:#4ade80; }
    #equation .blank.wrong-fill   { background:rgba(239,68,68,.2); border-color:#ef4444; color:#f87171; }

    /* ── Staircase scene ── */
    #scene {
      position:relative;
      width:100%;
      height:230px;
      background:linear-gradient(180deg,#1e3a5f 0%,#0f2744 100%);
      border-radius:20px;
      overflow:hidden;
      box-shadow:inset 0 4px 20px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.4);
    }
    #staircase {
      position:absolute; left:0; bottom:0; width:100%; height:100%;
    }
    .stair-step {
      position:absolute; bottom:0;
      background:linear-gradient(180deg,#a78bfa 0%,#7c3aed 100%);
      border-top:3px solid #c4b5fd;
      border-radius:4px 4px 0 0;
    }
    #goal-flag {
      position:absolute;
      font-size:2.2rem;
      transform:translate(-50%,-100%);
      filter:drop-shadow(0 4px 6px rgba(0,0,0,.5));
    }
    #climber {
      position:absolute;
      font-size:2.6rem;
      transform:translate(-50%,-92%) scaleX(-1);
      transition:left .28s ease-in-out, bottom .28s ease-in-out;
      filter:drop-shadow(0 4px 6px rgba(0,0,0,.5));
      z-index:2;
    }
    #climber.stepping { animation:stepHop .28s ease-in-out; }
    @keyframes stepHop {
      0%,100%{ transform:translate(-50%,-92%) scaleX(-1) translateY(0); }
      50%{ transform:translate(-50%,-92%) scaleX(-1) translateY(-10px); }
    }
    #climber.bump { animation:bump .35s ease; }
    @keyframes bump {
      0%,100%{ transform:translate(-50%,-92%) scaleX(-1) rotate(0); }
      50%{ transform:translate(-50%,-92%) scaleX(-1) rotate(-10deg); }
    }

    #progress-label {
      font-size:12px; color:#94a3b8; text-align:center;
    }
    #progress-label b { color:#FFD700; }

    /* ── Message ── */
    #message {
      font-size:16px; font-weight:bold; letter-spacing:1px;
      min-height:24px; text-align:center; color:#e2e8f0;
    }
    #message.correct { color:#22c55e; text-shadow:0 0 12px rgba(34,197,94,.5); }
    #message.wrong   { color:#ef4444; text-shadow:0 0 12px rgba(239,68,68,.5); }

    /* ── Answer buttons ── */
    #answers {
      display:grid; grid-template-columns:repeat(2,1fr);
      gap:12px; width:100%;
    }
    .ans-btn {
      padding:18px 10px;
      font-size:2rem; font-family:inherit; font-weight:bold; color:#fff;
      background:rgba(59,130,246,.12);
      border:3px solid rgba(59,130,246,.35);
      border-radius:20px; cursor:pointer;
      transition:transform .12s, background .12s, border-color .12s, box-shadow .12s;
      position:relative; overflow:hidden;
    }
    .ans-btn::before {
      content:''; position:absolute; inset:0;
      background:linear-gradient(135deg,rgba(255,255,255,.06) 0%,transparent 60%);
      border-radius:17px;
    }
    .ans-btn:hover:not(:disabled) {
      transform:scale(1.05) translateY(-3px);
      background:rgba(59,130,246,.28);
      border-color:#60a5fa;
      box-shadow:0 8px 28px rgba(59,130,246,.4);
    }
    .ans-btn:disabled { cursor:default; }
    .ans-btn.correct-ans {
      background:rgba(34,197,94,.28); border-color:#22c55e;
      box-shadow:0 0 24px rgba(34,197,94,.5); transform:scale(1.06);
    }
    .ans-btn.wrong-ans {
      background:rgba(239,68,68,.22); border-color:#ef4444;
      animation:shake .4s ease;
    }
    @keyframes shake {
      0%,100%{ transform:translateX(0); }
      20%{ transform:translateX(-8px); }
      40%{ transform:translateX(8px); }
      60%{ transform:translateX(-5px); }
      80%{ transform:translateX(5px); }
    }

    /* ── Next button ── */
    #next-btn {
      display:none; padding:13px 44px;
      font-size:1.15rem; font-family:inherit; font-weight:bold; color:#1a1a1a;
      background:linear-gradient(90deg,#FFD700,#F59E0B);
      border:none; border-radius:50px; cursor:pointer;
      box-shadow:0 5px 22px rgba(255,215,0,.4);
      transition:transform .12s;
    }
    #next-btn:hover { transform:scale(1.07); }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>
  <canvas id="confetti-canvas" class="confetti-layer"></canvas>

  <div id="game">
    <div id="topbar">
      <a class="home-btn" href="index.html">🏠</a>
      <span class="page-title">🪜 SUBE LA ESCALERA</span>
    </div>

    <div id="hud">
      <div class="hud-box">
        <div class="hud-label">Puntos</div>
        <div class="hud-value" id="score">0</div>
      </div>
      <div class="hud-box">
        <div class="hud-label">Racha</div>
        <div class="hud-value" id="streak">🔥 0</div>
      </div>
    </div>

    <div id="level-badge">NIVEL 1 — ESCALERAS PEQUEÑAS</div>

    <div id="prompt-card">
      <div id="prompt-text"></div>
      <div id="equation"></div>
    </div>

    <div id="scene">
      <div id="staircase"></div>
      <div id="goal-flag">🚩</div>
      <div id="climber">🚶‍♀️</div>
    </div>

    <div id="progress-label"></div>

    <div id="answers"></div>
    <div id="message">¿CUÁNTOS ESCALONES LE FALTAN PARA LLEGAR ARRIBA?</div>

    <button id="next-btn" onclick="nextQ()">SIGUIENTE ➡️</button>
  </div>

  <script>
    /* ── Starfield ── */
    const bgC=document.getElementById('bg'),bgX=bgC.getContext('2d');
    function rbg(){bgC.width=innerWidth;bgC.height=innerHeight;}
    rbg();window.addEventListener('resize',rbg);
    const stars=Array.from({length:160},()=>({x:Math.random(),y:Math.random(),r:.5+Math.random()*1.5,sp:.00008+Math.random()*.00015,tw:Math.random()*Math.PI*2}));
    const bgF=['🪜','🚶‍♀️','⬆️','🚩','?'].map(c=>({t:c,x:Math.random(),y:Math.random(),sp:.0001+Math.random()*.0002,sz:13+Math.random()*16,a:.04+Math.random()*.07}));
    function drawBg(){const W=bgC.width,H=bgC.height;bgX.fillStyle='#0f0f1a';bgX.fillRect(0,0,W,H);for(const s of stars){s.tw+=s.sp*60;bgX.globalAlpha=.4+Math.sin(s.tw)*.4;bgX.fillStyle='#fff';bgX.beginPath();bgX.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);bgX.fill();}for(const f of bgF){f.y-=f.sp;if(f.y<-.05)f.y=1.05;bgX.globalAlpha=f.a;bgX.fillStyle='#FFD700';bgX.font=`bold ${f.sz}px Arial`;bgX.textAlign='center';bgX.fillText(f.t,f.x*W,f.y*H);}bgX.globalAlpha=1;requestAnimationFrame(drawBg);}
    drawBg();

    /* ── Confetti ── */
    const cfC=document.getElementById('confetti-canvas'),cfX=cfC.getContext('2d');
    cfC.width=innerWidth;cfC.height=innerHeight;
    window.addEventListener('resize',()=>{cfC.width=innerWidth;cfC.height=innerHeight;});
    let cp=[];
    function burst(){const cols=['#FFD700','#22c55e','#3b82f6','#ec4899','#f97316','#8b5cf6'];for(let i=0;i<90;i++)cp.push({x:innerWidth/2+(Math.random()-.5)*340,y:innerHeight*.35,vx:(Math.random()-.5)*10,vy:-7-Math.random()*9,sz:6+Math.random()*8,col:cols[~~(Math.random()*cols.length)],rot:Math.random()*360,rv:(Math.random()-.5)*14,life:1});requestAnimationFrame(animCf);}
    function animCf(){cfX.clearRect(0,0,cfC.width,cfC.height);cp=cp.filter(p=>p.life>.02);for(const p of cp){p.vy+=.38;p.x+=p.vx;p.y+=p.vy;p.rot+=p.rv;p.life-=.018;cfX.save();cfX.globalAlpha=p.life;cfX.translate(p.x,p.y);cfX.rotate(p.rot*Math.PI/180);cfX.fillStyle=p.col;cfX.fillRect(-p.sz/2,-p.sz/2,p.sz,p.sz*.55);cfX.restore();}if(cp.length>0)requestAnimationFrame(animCf);else cfX.clearRect(0,0,cfC.width,cfC.height);}

    /* ── Level definitions: total = full staircase, climbed = already climbed,
       missing = total - climbed (always what the player must answer) ── */
    const LEVELS=[
      { label:'1', desc:'ESCALERAS PEQUEÑAS', totalMin:5,  totalMax:10 },
      { label:'2', desc:'ESCALERAS MEDIANAS', totalMin:10, totalMax:16 },
      { label:'3', desc:'ESCALERAS GRANDES',  totalMin:16, totalMax:22 },
      { label:'4', desc:'ESCALERAS ALTAS',    totalMin:20, totalMax:28 },
      { label:'5', desc:'¡SÚPER ESCALERA!',   totalMin:15, totalMax:30 },
    ];
    const ADVANCE=4;
    const MIN_STEP_H=14, MAX_STEP_H=190; // px — real step heights are scaled to fit this range regardless of total

    let score=0, streak=0, levelIdx=0, correctInLevel=0;
    let total=10, climbed=4, missing=6, answered=false;

    function genQuestion(){
      const lvl=LEVELS[levelIdx];
      total=lvl.totalMin+Math.floor(Math.random()*(lvl.totalMax-lvl.totalMin+1));
      climbed=Math.floor(Math.random()*(total-1)); // leaves at least 1 step missing
      missing=total-climbed;
    }

    /* Height of the step at 1-based position `n` (n=1..total) — draws EXACTLY
       `total` steps, one per unit, scaled to fit the scene regardless of size. */
    function stepHeight(n){
      if(total<=1) return MAX_STEP_H;
      return MIN_STEP_H + (n-1)*(MAX_STEP_H-MIN_STEP_H)/(total-1);
    }

    function renderStaircase(){
      const rack=document.getElementById('staircase');
      rack.innerHTML='';
      const stepW=100/total;
      for(let n=1; n<=total; n++){
        const step=document.createElement('div');
        step.className='stair-step';
        step.style.height=stepHeight(n)+'px';
        step.style.left=((n-1)*stepW)+'%';
        step.style.width=(stepW+0.6)+'%';
        rack.appendChild(step);
      }
      document.getElementById('goal-flag').style.left=((total-1)*stepW + stepW/2)+'%';
      document.getElementById('goal-flag').style.bottom=(stepHeight(total)+4)+'px';
      positionClimberAtCount(climbed, false);
    }

    /* Position the climber standing exactly on step number `n` (n=0 = the
       ground, before the first step; n=total = standing on the top step). */
    function positionClimberAtCount(n, animate){
      const climber=document.getElementById('climber');
      climber.style.transition = animate ? '' : 'none';
      const stepW=100/total;
      if(n<=0){
        climber.style.left=(stepW/2)+'%';
        climber.style.bottom='2px';
      } else {
        climber.style.left=((n-1)*stepW + stepW/2)+'%';
        climber.style.bottom=(stepHeight(n)+2)+'px';
      }
      if(!animate) climber.offsetHeight; // force reflow before re-enabling transitions
      climber.style.transition='';
    }

    /* Walk the climber up one real step at a time — exactly `missing` hops. */
    function climbToTop(onDone){
      const climber=document.getElementById('climber');
      let n=climbed;
      const STEP_MS=220;

      function hop(){
        if(n>=total){ onDone && onDone(); return; }
        n++;
        positionClimberAtCount(n, true);
        climber.classList.add('stepping');
        setTimeout(()=>climber.classList.remove('stepping'), STEP_MS);
        setTimeout(hop, STEP_MS);
      }
      hop();
    }

    function renderPrompt(){
      document.getElementById('prompt-text').innerHTML=
        `El personaje ya subió <b>${climbed}</b> escalón${climbed===1?'':'es'}. ¡La escalera tiene <b>${total}</b> en total!`;
      document.getElementById('equation').innerHTML=
        `${climbed} + <span class="blank">?</span> = ${total}`;
      document.getElementById('progress-label').innerHTML=
        `Escalón <b>${climbed}</b> de <b>${total}</b>`;
    }

    function renderAnswers(){
      const cont=document.getElementById('answers');
      cont.innerHTML='';
      const opts=new Set([missing]);
      const deltas=[1,2,3,4];
      let attempts=0;
      while(opts.size<4 && attempts<200){
        attempts++;
        const d=deltas[Math.floor(Math.random()*deltas.length)];
        const sign=Math.random()<.5?1:-1;
        const w=missing+sign*d;
        if(w>=1 && w!==missing) opts.add(w);
      }
      for(let d=1; opts.size<4; d++){
        if(missing+d>=1) opts.add(missing+d);
        if(opts.size<4 && missing-d>=1) opts.add(missing-d);
      }
      [...opts].sort(()=>Math.random()-.5).forEach(val=>{
        const btn=document.createElement('button');
        btn.className='ans-btn';
        btn.textContent=val;
        btn.addEventListener('click',()=>checkAnswer(btn,val));
        cont.appendChild(btn);
      });
    }

    function checkAnswer(btn,val){
      if(answered) return;
      answered=true;
      document.querySelectorAll('.ans-btn').forEach(b=>b.disabled=true);

      const blank=document.querySelector('#equation .blank');

      if(val===missing){
        btn.classList.add('correct-ans');
        if(blank){ blank.textContent=val; blank.classList.add('filled','correct-fill'); }
        document.getElementById('prompt-card').classList.add('correct');
        climbToTop(burst);
        streak++; const bonus=streak>=3?20:10; score+=bonus;
        document.getElementById('score').textContent=score;
        document.getElementById('streak').textContent=`🔥 ${streak}`;
        const msg=streak>=5?`🏆 ¡RACHA DE ${streak}! +${bonus} PTS`:
                  streak>=3?`⭐ ¡GENIAL! RACHA DE ${streak}! +${bonus} PTS`:
                            `✅ ¡LLEGÓ ARRIBA! LE FALTABAN ${missing}`;
        setMsg(msg,'correct');
        correctInLevel++;
        if(correctInLevel>=ADVANCE && levelIdx<LEVELS.length-1){
          levelIdx++; correctInLevel=0; updateBadge();
          setTimeout(()=>setMsg(`🚀 ¡NIVEL ${LEVELS[levelIdx].label}! ${LEVELS[levelIdx].desc}`,'correct'),1000);
        }
        document.getElementById('next-btn').style.display='inline-block';
      } else {
        btn.classList.add('wrong-ans');
        if(blank){ blank.classList.add('wrong-fill'); }
        document.getElementById('prompt-card').classList.add('wrong');
        const climber=document.getElementById('climber');
        climber.classList.add('bump');
        setTimeout(()=>climber.classList.remove('bump'),350);
        streak=0; document.getElementById('streak').textContent='🔥 0';
        setMsg('❌ ¡INCORRECTO! INTÉNTALO DE NUEVO','wrong');
        setTimeout(()=>{
          answered=false;
          document.getElementById('prompt-card').className='';
          if(blank){ blank.classList.remove('wrong-fill'); }
          document.querySelectorAll('.ans-btn').forEach(b=>{
            b.disabled=false;
            b.classList.remove('wrong-ans','correct-ans');
          });
          setMsg('¿CUÁNTOS ESCALONES LE FALTAN PARA LLEGAR ARRIBA?','');
        },900);
      }
    }

    function nextQ(){
      document.getElementById('next-btn').style.display='none';
      document.getElementById('prompt-card').className='';
      answered=false;

      genQuestion();
      renderStaircase();
      renderPrompt();
      renderAnswers();
      setMsg('¿CUÁNTOS ESCALONES LE FALTAN PARA LLEGAR ARRIBA?','');
    }

    function updateBadge(){
      const l=LEVELS[levelIdx];
      document.getElementById('level-badge').textContent=`NIVEL ${l.label} — ${l.desc}`;
    }
    function setMsg(t,c){const e=document.getElementById('message');e.textContent=t;e.className=c;}

    nextQ();
  </script>
</body>
</html>
