<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Entrenamiento de la Celeste – MicaGames</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      background:#0f0f1a;
      min-height:100vh;
      display:flex; flex-direction:column; align-items:center;
      font-family:'Arial Rounded MT Bold', Arial, sans-serif;
      overflow-y:auto; overflow-x:hidden;
      user-select:none;
    }

    canvas#bg { position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; }

    #game {
      position:relative; z-index:1;
      display:flex; flex-direction:column;
      align-items:center; gap:10px;
      padding:10px 16px 16px;
      width:100%; max-width:600px;
    }

    /* ── Top bar ── */
    #topbar { display:flex; align-items:center; gap:12px; width:100%; }
    .home-btn {
      text-decoration:none;
      background:rgba(255,255,255,0.08);
      border:2px solid rgba(255,255,255,0.15);
      border-radius:50%; width:36px; height:36px;
      display:flex; align-items:center; justify-content:center; font-size:1.1rem;
      transition:border-color .15s, background .15s;
    }
    .home-btn:hover { border-color:#FFD700; background:rgba(255,215,0,.1); }
    .page-title {
      color:#FFD700; font-size:16px;
      text-shadow:0 0 20px rgba(255,215,0,.4), 2px 2px 0 #b8860b;
      letter-spacing:1px;
    }

    /* ── HUD ── */
    #hud { display:flex; gap:22px; align-items:center; }
    .hud-box { text-align:center; }
    .hud-label { color:#64748b; font-size:10px; letter-spacing:2px; text-transform:uppercase; }
    .hud-value { color:#FFD700; font-size:19px; font-weight:bold; text-shadow:0 0 14px rgba(255,215,0,.4); }

    #level-badge {
      background:rgba(255,215,0,.1); border:2px solid rgba(255,215,0,.3);
      color:#FFD700; font-size:11px; letter-spacing:2px;
      padding:3px 14px; border-radius:20px;
    }

    /* ── Field card ── */
    #field-card {
      width:100%;
      background:rgba(255,255,255,.05);
      border:2px solid rgba(255,255,255,.1);
      border-radius:22px;
      padding:14px 18px;
      display:flex; flex-direction:column;
      align-items:center; gap:10px;
      transition:border-color .3s, box-shadow .3s;
    }
    #field-card.correct { border-color:#22c55e; box-shadow:0 0 40px rgba(34,197,94,.3); }
    #field-card.wrong   { border-color:#ef4444; box-shadow:0 0 40px rgba(239,68,68,.25); }

    #prompt {
      font-size:12px; color:#94a3b8; text-align:center; line-height:1.35;
    }
    #prompt b { color:#e2e8f0; }

    /* ── Baskets row: antes / nuevas ── */
    #baskets-row {
      display:flex; align-items:center; justify-content:center;
      gap:14px; flex-wrap:wrap; width:100%;
    }
    .basket {
      display:flex; flex-direction:column; align-items:center; gap:4px;
      background:rgba(255,255,255,.04);
      border:2px solid rgba(255,255,255,.08);
      border-radius:16px; padding:8px 16px;
      min-width:110px;
    }
    .basket-icon { font-size:1.9rem; }
    .basket-tag {
      font-size:10px; letter-spacing:1px; color:#64748b; text-transform:uppercase;
    }
    .basket-value {
      font-size:1.6rem; font-weight:bold; color:#FFD700;
      text-shadow:0 0 14px rgba(255,215,0,.4);
    }
    .plus-sign {
      font-size:1.8rem; font-weight:bold; color:#FFD700;
      text-shadow:0 0 20px rgba(255,215,0,.5);
    }

    /* ── Column addition ── */
    #column-add {
      display:flex; flex-direction:column; align-items:flex-end;
      background:rgba(255,255,255,.04);
      border:2px solid rgba(255,255,255,.1);
      border-radius:14px; padding:8px 20px;
      font-variant-numeric: tabular-nums;
    }
    .col-headers { display:flex; gap:14px; margin-bottom:2px; }
    .col-headers span { width:34px; text-align:center; font-size:10px; letter-spacing:2px; color:#64748b; }
    .col-row { display:flex; gap:14px; align-items:center; }
    .col-row .digit {
      width:34px; text-align:center; font-size:1.4rem; font-weight:bold; color:#e2e8f0;
    }
    .col-row .op { width:20px; text-align:center; font-size:1.2rem; color:#FFD700; }
    .col-line { width:100%; border-bottom:3px solid #FFD700; margin:4px 0; }
    .col-result .digit { color:#FFD700; text-shadow:0 0 14px rgba(255,215,0,.5); }

    /* ── Message ── */
    #message {
      font-size:14px; font-weight:bold; letter-spacing:1px;
      min-height:20px; text-align:center; color:#e2e8f0;
    }
    #message.correct { color:#22c55e; text-shadow:0 0 12px rgba(34,197,94,.5); }
    #message.wrong   { color:#ef4444; text-shadow:0 0 12px rgba(239,68,68,.5); }

    /* ── Answer buttons ── */
    #answers {
      display:grid; grid-template-columns:repeat(2,1fr);
      gap:10px; width:100%;
    }
    .ans-btn {
      padding:12px 10px;
      font-size:1.5rem; font-family:inherit; font-weight:bold; color:#fff;
      background:rgba(59,130,246,.12);
      border:3px solid rgba(59,130,246,.35);
      border-radius:20px; cursor:pointer;
      transition:transform .12s, background .12s, border-color .12s, box-shadow .12s;
      position:relative; overflow:hidden;
    }
    .ans-btn::before {
      content:''; position:absolute; inset:0;
      background:linear-gradient(135deg,rgba(255,255,255,.06) 0%,transparent 60%);
      border-radius:17px;
    }
    .ans-btn:hover:not(:disabled) {
      transform:scale(1.05) translateY(-3px);
      background:rgba(59,130,246,.28);
      border-color:#60a5fa;
      box-shadow:0 8px 28px rgba(59,130,246,.4);
    }
    .ans-btn:disabled { cursor:default; }
    .ans-btn.correct-ans {
      background:rgba(34,197,94,.28); border-color:#22c55e;
      box-shadow:0 0 24px rgba(34,197,94,.5); transform:scale(1.06);
    }
    .ans-btn.wrong-ans {
      background:rgba(239,68,68,.22); border-color:#ef4444;
      animation:shake .4s ease;
    }
    @keyframes shake {
      0%,100%{ transform:translateX(0); }
      20%{ transform:translateX(-8px); }
      40%{ transform:translateX(8px); }
      60%{ transform:translateX(-5px); }
      80%{ transform:translateX(5px); }
    }

    /* ── Next button ── */
    #next-btn {
      display:none; padding:9px 36px;
      font-size:1rem; font-family:inherit; font-weight:bold; color:#1a1a1a;
      background:linear-gradient(90deg,#FFD700,#F59E0B);
      border:none; border-radius:50px; cursor:pointer;
      box-shadow:0 5px 22px rgba(255,215,0,.4); transition:transform .12s;
    }
    #next-btn:hover { transform:scale(1.07); }

    .confetti-layer { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:50; }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>
  <canvas id="confetti-canvas" class="confetti-layer"></canvas>

  <div id="game">
    <div id="topbar">
      <a class="home-btn" href="index.html">🏠</a>
      <span class="page-title">⚽ ENTRENAMIENTO DE LA CELESTE</span>
    </div>

    <div id="hud">
      <div class="hud-box">
        <div class="hud-label">Puntos</div>
        <div class="hud-value" id="score">0</div>
      </div>
      <div class="hud-box">
        <div class="hud-label">Racha</div>
        <div class="hud-value" id="streak">🔥 0</div>
      </div>
    </div>

    <div id="level-badge">NIVEL 1 — SIN LLEVAR</div>

    <div id="field-card">
      <div id="prompt">Hay un canasto con pelotas para el entrenamiento. El utilero trae más pelotas nuevas. <b>¿Cuántas hay en total para empezar el partido?</b></div>

      <div id="baskets-row">
        <div class="basket">
          <div class="basket-icon">🧺⚽</div>
          <div class="basket-tag">Antes</div>
          <div class="basket-value" id="val-a">--</div>
        </div>
        <div class="plus-sign">+</div>
        <div class="basket">
          <div class="basket-icon">🛒⚽</div>
          <div class="basket-tag">Nuevas</div>
          <div class="basket-value" id="val-b">--</div>
        </div>
      </div>

      <div id="column-add">
        <div class="col-headers"><span>D</span><span>U</span><span style="width:20px"></span></div>
        <div class="col-row" id="row-a"></div>
        <div class="col-row" id="row-b"></div>
        <div class="col-line"></div>
        <div class="col-row col-result" id="row-r"></div>
      </div>

      <div id="message">¡PRESIONA SIGUIENTE PARA COMENZAR!</div>
    </div>

    <button id="next-btn" style="display:inline-block" onclick="nextQ()">¡COMENZAR! ⚽</button>

    <div id="answers"></div>
  </div>

  <script>
    /* ── Starfield-ish background with soccer motifs ── */
    const bgC=document.getElementById('bg'),bgX=bgC.getContext('2d');
    function rbg(){bgC.width=innerWidth;bgC.height=innerHeight;}
    rbg();window.addEventListener('resize',rbg);
    const stars=Array.from({length:160},()=>({x:Math.random(),y:Math.random(),r:.5+Math.random()*1.5,sp:.00008+Math.random()*.00015,tw:Math.random()*Math.PI*2}));
    const bgF=['⚽','+','=','🥅','D','U'].map(c=>({t:c,x:Math.random(),y:Math.random(),sp:.0001+Math.random()*.0002,sz:13+Math.random()*16,a:.04+Math.random()*.07}));
    function drawBg(){const W=bgC.width,H=bgC.height;bgX.fillStyle='#0f0f1a';bgX.fillRect(0,0,W,H);for(const s of stars){s.tw+=s.sp*60;bgX.globalAlpha=.4+Math.sin(s.tw)*.4;bgX.fillStyle='#fff';bgX.beginPath();bgX.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);bgX.fill();}for(const f of bgF){f.y-=f.sp;if(f.y<-.05)f.y=1.05;bgX.globalAlpha=f.a;bgX.fillStyle='#FFD700';bgX.font=`bold ${f.sz}px Arial`;bgX.textAlign='center';bgX.fillText(f.t,f.x*W,f.y*H);}bgX.globalAlpha=1;requestAnimationFrame(drawBg);}
    drawBg();

    /* ── Confetti ── */
    const cfC=document.getElementById('confetti-canvas'),cfX=cfC.getContext('2d');
    cfC.width=innerWidth;cfC.height=innerHeight;
    window.addEventListener('resize',()=>{cfC.width=innerWidth;cfC.height=innerHeight;});
    let cp=[];
    function burst(){const cols=['#FFD700','#22c55e','#3b82f6','#ec4899','#f97316','#8b5cf6'];for(let i=0;i<80;i++)cp.push({x:innerWidth/2+(Math.random()-.5)*300,y:innerHeight*.38,vx:(Math.random()-.5)*10,vy:-7-Math.random()*9,sz:6+Math.random()*8,col:cols[~~(Math.random()*cols.length)],rot:Math.random()*360,rv:(Math.random()-.5)*14,life:1});requestAnimationFrame(animCf);}
    function animCf(){cfX.clearRect(0,0,cfC.width,cfC.height);cp=cp.filter(p=>p.life>.02);for(const p of cp){p.vy+=.38;p.x+=p.vx;p.y+=p.vy;p.rot+=p.rv;p.life-=.018;cfX.save();cfX.globalAlpha=p.life;cfX.translate(p.x,p.y);cfX.rotate(p.rot*Math.PI/180);cfX.fillStyle=p.col;cfX.fillRect(-p.sz/2,-p.sz/2,p.sz,p.sz*.55);cfX.restore();}if(cp.length>0)requestAnimationFrame(animCf);else cfX.clearRect(0,0,cfC.width,cfC.height);}

    const LEVELS=[
      {label:'1', desc:'SIN LLEVAR'},
      {label:'2', desc:'CON LLEVAR'},
      {label:'3', desc:'¡ERES UN EXPERTO!'},
    ];
    const ADVANCE=5;

    let score=0, streak=0, levelIdx=0, correctInLevel=0;
    let a=10, b=10, correct=20, answered=true;

    /* ── Generate two 2-digit numbers depending on level ── */
    function genNumbers(){
      const tens = ()=>10*(2+Math.floor(Math.random()*6)); // 20..70
      const ones = ()=>Math.floor(Math.random()*10);
      let na, nb;
      if(levelIdx===0){
        // no carrying: units of both numbers sum < 10
        do{
          na = tens()+ones();
          nb = tens()+ones();
        } while((na%10)+(nb%10) >= 10 || na+nb >= 100);
      } else if(levelIdx===1){
        // carrying required: units sum >= 10, total stays under 100
        do{
          na = tens()+ones();
          nb = tens()+ones();
        } while((na%10)+(nb%10) < 10 || na+nb >= 100);
      } else {
        // bigger numbers, carrying allowed, total can reach up to 99
        do{
          na = 10*(3+Math.floor(Math.random()*6))+ones();
          nb = 10*(2+Math.floor(Math.random()*6))+ones();
        } while(na+nb >= 100 || na+nb < 40);
      }
      return [na, nb];
    }

    function renderColumn(){
      const rowA=document.getElementById('row-a');
      const rowB=document.getElementById('row-b');
      const rowR=document.getElementById('row-r');
      const da=String(a).padStart(2,'0'), db=String(b).padStart(2,'0');
      rowA.innerHTML = `<span class="digit">${da[0]}</span><span class="digit">${da[1]}</span><span class="op"></span>`;
      rowB.innerHTML = `<span class="digit">${db[0]}</span><span class="digit">${db[1]}</span><span class="op">+</span>`;
      rowR.innerHTML = `<span class="digit">?</span><span class="digit">?</span><span class="op">=</span>`;
    }

    function renderBaskets(){
      document.getElementById('val-a').textContent = a;
      document.getElementById('val-b').textContent = b;
    }

    function nextQ(){
      document.getElementById('next-btn').style.display='none';
      document.getElementById('field-card').className='';
      document.getElementById('answers').innerHTML='';

      [a,b] = genNumbers();
      correct = a+b;
      answered = false;

      renderBaskets();
      renderColumn();
      renderAnswers();
      setMsg('¿CUÁNTAS PELOTAS HAY EN TOTAL?','');
    }

    /* ── Answer choices ── */
    function renderAnswers(){
      const cont=document.getElementById('answers');
      cont.innerHTML='';

      const opts=new Set([correct]);
      // classic "forgot to carry" distractor: add digits column-wise without carrying
      const noCarry = (Math.floor(a/10)+Math.floor(b/10))*10 + ((a%10)+(b%10))%10;
      if(noCarry!==correct && noCarry>0) opts.add(noCarry);

      while(opts.size<4){
        const d=Math.floor(Math.random()*6)+1;
        const w=Math.random()<.5?correct+d:correct-d;
        if(w>=2 && w<=99 && w!==correct) opts.add(w);
      }

      [...opts].slice(0,4).sort(()=>Math.random()-.5).forEach(val=>{
        const btn=document.createElement('button');
        btn.className='ans-btn';
        btn.textContent=val;
        btn.addEventListener('click',()=>checkAnswer(btn,val));
        cont.appendChild(btn);
      });
    }

    function checkAnswer(btn,val){
      if(answered) return;
      answered=true;
      document.querySelectorAll('.ans-btn').forEach(b=>b.disabled=true);

      const dr=String(correct).padStart(2,'0');
      document.getElementById('row-r').innerHTML = `<span class="digit">${dr[0]}</span><span class="digit">${dr[1]}</span><span class="op">=</span>`;

      if(val===correct){
        btn.classList.add('correct-ans');
        document.getElementById('field-card').classList.add('correct');
        streak++; const bonus=streak>=3?20:10; score+=bonus;
        document.getElementById('score').textContent=score;
        document.getElementById('streak').textContent=`🔥 ${streak}`;
        const msg=streak>=5?`🏆 ¡RACHA DE ${streak}! +${bonus} PTS`:
                  streak>=3?`⭐ ¡GENIAL! RACHA DE ${streak}! +${bonus} PTS`:
                            `✅ ¡CORRECTO! ${a} + ${b} = ${correct}`;
        setMsg(msg,'correct');
        burst();
        correctInLevel++;
        if(correctInLevel>=ADVANCE && levelIdx<LEVELS.length-1){
          levelIdx++; correctInLevel=0; updateBadge();
          setTimeout(()=>setMsg(`🚀 ¡NIVEL ${LEVELS[levelIdx].label}! ${LEVELS[levelIdx].desc}`,'correct'),900);
        }
        document.getElementById('next-btn').textContent='SIGUIENTE ➡️';
        document.getElementById('next-btn').style.display='inline-block';
      } else {
        btn.classList.add('wrong-ans');
        document.getElementById('field-card').classList.add('wrong');
        streak=0; document.getElementById('streak').textContent='🔥 0';
        setMsg('❌ ¡INCORRECTO! INTÉNTALO DE NUEVO','wrong');
        setTimeout(()=>{
          answered=false;
          document.getElementById('field-card').className='';
          document.getElementById('row-r').innerHTML = `<span class="digit">?</span><span class="digit">?</span><span class="op">=</span>`;
          document.querySelectorAll('.ans-btn').forEach(b=>{
            b.disabled=false;
            b.classList.remove('wrong-ans','correct-ans');
          });
          setMsg('¿CUÁNTAS PELOTAS HAY EN TOTAL?','');
        }, 900);
      }
    }

    function updateBadge(){
      const l=LEVELS[levelIdx];
      document.getElementById('level-badge').textContent=`NIVEL ${l.label} — ${l.desc}`;
    }
    function setMsg(t,c){const e=document.getElementById('message');e.textContent=t;e.className=c;}
  </script>
</body>
</html>
