<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>¡Salto Matemático!</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: Arial, sans-serif;
    }
    .top-bar {
      display: flex;
      align-items: center;
      width: min(800px, 100vw);
      margin-bottom: 8px;
      gap: 12px;
    }
    #game-wrap {
      width: min(800px, 100vw);
    }
    #game-wrap canvas {
      width: 100% !important;
      height: auto !important;
      display: block;
    }
    .back-btn {
      color: #FFD700;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
      background: rgba(255,215,0,0.1);
      border: 1px solid rgba(255,215,0,0.3);
      padding: 5px 14px;
      border-radius: 20px;
      transition: background 0.15s;
    }
    .back-btn:hover { background: rgba(255,215,0,0.2); }
    h1 { color: #FFD700; font-size: 22px; letter-spacing: 2px; flex: 1; text-align: center; }
    .spacer { width: 80px; }
    #game { border: 3px solid #FFD700; border-radius: 10px; display: block; }
    #controls {
      color: #888; font-size: 13px; margin-top: 8px;
      text-align: center; line-height: 1.8;
    }
    span { color: #FFD700; font-weight: bold; }

    /* ── Rules button & overlay ─────────────────────────────────────── */
    #rules-btn {
      position: fixed; top: 18px; right: 22px; z-index: 25;
      width: 38px; height: 38px; border-radius: 50%;
      background: rgba(255,215,0,0.12); border: 2px solid rgba(255,215,0,0.35);
      color: #FFD700; font-size: 20px; font-weight: bold;
      cursor: pointer; transition: background .15s; line-height: 1;
      display: flex; align-items: center; justify-content: center;
    }
    #rules-btn:hover { background: rgba(255,215,0,0.28); }
    #rules-overlay {
      position: fixed; inset: 0; z-index: 40;
      background: rgba(15,15,26,.88);
      display: flex; align-items: center; justify-content: center;
    }
    #rules-card {
      background: rgba(255,255,255,.07);
      border: 2px solid rgba(255,215,0,.3);
      border-radius: 24px; padding: 36px 40px;
      max-width: 440px; text-align: center;
      display: flex; flex-direction: column; gap: 18px;
    }
    #rules-card h2 {
      color: #FFD700; font-size: 22px; letter-spacing: 3px;
    }
    #rules-card p {
      color: #e2e8f0; font-size: 15px; line-height: 1.8;
      white-space: pre-line; letter-spacing: .5px;
    }
    #rules-close {
      background: linear-gradient(90deg,#FFD700,#F59E0B);
      color: #1a1a1a; font-size: 16px; font-weight: bold;
      border: none; border-radius: 30px; padding: 10px 32px;
      cursor: pointer; letter-spacing: 1px; align-self: center;
    }
    #rules-close:hover { opacity: .88; }
  </style>
</head>
<body>
  <!-- Rules button -->
  <button id="rules-btn" onclick="toggleRules()">?</button>

  <!-- Rules overlay -->
  <div id="rules-overlay" style="display:none">
    <div id="rules-card">
      <h2>📖 CÓMO JUGAR</h2>
      <p>USA ← → (O A/D) PARA MOVER Y ↑/ESPACIO PARA SALTAR.
SALTA ENCIMA O GOLPEA DESDE ABAJO AL ENEMIGO
QUE TIENE LA RESPUESTA CORRECTA.</p>
      <button id="rules-close" onclick="toggleRules()">✕ CERRAR</button>
    </div>
  </div>

  <div class="top-bar">
    <a class="back-btn" href="index.html">← MENÚ</a>
    <h1>⭐ ¡SALTO MATEMÁTICO! ⭐</h1>
    <div class="spacer"></div>
  </div>
  <div id="game-wrap"><canvas id="game" width="800" height="500"></canvas></div>
  <p id="controls">
    <span>← →</span> MOVER &nbsp;|&nbsp; <span>↑ / ESPACIO</span> SALTAR &nbsp;|&nbsp;
    ¡SALTA SOBRE EL ENEMIGO CON LA <span>RESPUESTA CORRECTA</span>!
  </p>

<script>
const canvas = document.getElementById('game');
const ctx    = canvas.getContext('2d');
const W = 800, H = 500;

// ─── Audio ────────────────────────────────────────────────────────────────────
const ac = new (window.AudioContext || window.webkitAudioContext)();
function beep(freq, dur, type = 'sine', vol = 0.25) {
  if (ac.state === 'suspended') return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.connect(g); g.connect(ac.destination);
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
  o.start(); o.stop(ac.currentTime + dur);
}
function sfxJump()    { beep(350,.05); setTimeout(()=>beep(600,.08),50); }
function sfxCorrect() { [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.15),i*80)); }
function sfxWrong()   { beep(180,.3,'sawtooth',.15); }
function sfxHit()     { beep(220,.25,'triangle',.2); }

// ─── Platforms ────────────────────────────────────────────────────────────────
const GROUND = { x: 0, y: 448, w: 800, h: 52, isGround: true };
const platforms = [
  GROUND,
  { x: 50,  y: 330, w: 180, h: 18 },
  { x: 320, y: 260, w: 180, h: 18 },
  { x: 570, y: 340, w: 160, h: 18 },
  { x: 190, y: 190, w: 150, h: 18 },
  { x: 490, y: 190, w: 150, h: 18 },
];
const enemyPlatforms = platforms.slice(1);

// ─── State ────────────────────────────────────────────────────────────────────
let player, enemies, particles, question;
let score, lives, gameState, celebrating, celebTimer;
let scrollLeft = 0; // remaining pixels to scroll this round

function resetGame() {
  player = {
    x: 60, y: 395, w: 36, h: 44,
    vx: 0, vy: 0,
    onGround: false, facing: 1,
    invincible: 0, animFrame: 0, animTick: 0,
  };
  score = 0; lives = 3;
  gameState = 'playing';
  celebrating = false; celebTimer = 0;
  scrollLeft = 0;
  particles = []; enemies = [];
  spawnQuestion();
}

// ─── Question / Enemies ───────────────────────────────────────────────────────
// Spread platforms evenly across the canvas so they're always visible
function repositionPlatforms() {
  const slots = shuffle([
    { x: 40,  y: 330 }, { x: 200, y: 260 }, { x: 390, y: 310 },
    { x: 560, y: 250 }, { x: 120, y: 190 }, { x: 480, y: 190 },
    { x: 300, y: 370 }, { x: 600, y: 340 },
  ]);
  enemyPlatforms.forEach((p, i) => {
    const slot = slots[i % slots.length];
    p.x = slot.x;
    p.y = slot.y;
  });
}

function spawnQuestion() {
  repositionPlatforms();

  const a = rand(1, 9);
  const b = rand(1, 9);
  const correct = a + b;
  const wrongs = new Set();
  while (wrongs.size < 2) { const w = rand(2,18); if (w !== correct) wrongs.add(w); }
  question = { a, b, answer: correct };

  const answers = shuffle([correct, ...wrongs]);
  const platSlots = shuffle([...enemyPlatforms]).slice(0, 3);
  enemies = answers.map((num, i) => makeEnemy(platSlots[i], num, num === correct));
}

const CREATURE_TYPES = ['fish', 'octopus', 'shark', 'whale', 'dolphin', 'mushroom', 'toast', 'bucket'];

function makeEnemy(plat, num, isCorrect) {
  return {
    x: plat.x + rand(10, Math.max(11, plat.w - 50)),
    y: plat.y - 52,
    w: 56, h: 52,
    vx: (Math.random() > 0.5 ? 1 : -1) * 1.4,
    num, isCorrect, plat, alive: true,
    type: CREATURE_TYPES[Math.floor(Math.random() * CREATURE_TYPES.length)],
  };
}

// ─── Scroll world left (mermaid swims forward) ────────────────────────────────
function shiftWorld() {
  scrollLeft = 380; // total pixels to scroll smoothly
  player.vx  = 6;   // brief swim-right burst
}

// ─── Input ────────────────────────────────────────────────────────────────────
const keys = {};
document.addEventListener('keydown', e => {
  if (!keys[e.code]) {
    if ((e.code === 'ArrowUp' || e.code === 'Space') && player?.onGround && gameState === 'playing') {
      player.vy = -14.5; player.onGround = false; sfxJump(); ac.resume();
    }
    if (e.code === 'Enter' && gameState === 'gameover') resetGame();
  }
  keys[e.code] = true;
  ac.resume();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

// ─── Physics ──────────────────────────────────────────────────────────────────
function resolvePlayerPlatforms() {
  player.onGround = false;
  for (const p of platforms) {
    const inX = player.x + player.w > p.x && player.x < p.x + p.w;
    if (inX && player.vy >= 0) {
      const foot = player.y + player.h;
      const prevFoot = foot - player.vy;
      if (prevFoot <= p.y + 4 && foot >= p.y && foot <= p.y + 24) {
        player.y = p.y - player.h;
        player.vy = 0;
        player.onGround = true;
      }
    }
  }
}

function overlap(a, b) {
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}

// ─── Update ───────────────────────────────────────────────────────────────────
function update() {
  if (gameState !== 'playing') return;

  // ── Smooth world scroll ───────────────────────────────────────────────────
  if (scrollLeft > 0) {
    const step = Math.min(6, scrollLeft);
    scrollLeft -= step;
    for (const p of enemyPlatforms) {
      p.x -= step;
      if (p.x + p.w < -60) {           // went off left edge → recycle to right
        p.x = W + rand(40, 180);
        p.y = 140 + rand(0, 260);
      }
    }
    for (const e of enemies) {
      if (e.alive) e.x -= step;        // living enemies scroll with the world
    }
    // nudge player slightly right so they don't drift off left
    if (player.x < 70) player.x += step * 0.4;
  }

  if      (keys['ArrowLeft']  || keys['KeyA']) { player.vx = -5.5; player.facing = -1; }
  else if (keys['ArrowRight'] || keys['KeyD']) { player.vx =  5.5; player.facing =  1; }
  else player.vx *= 0.75;

  player.vy = Math.min(player.vy + 0.65, 18);
  player.x += player.vx;
  player.y += player.vy;

  player.x = Math.max(0, Math.min(W - player.w, player.x));

  resolvePlayerPlatforms();

  if (player.y > H + 50) { loseLife(); return; }

  player.animTick++;
  if (player.animTick % 8 === 0) player.animFrame ^= 1;
  if (player.invincible > 0) player.invincible--;

  for (const e of enemies) {
    if (!e.alive) continue;
    e.x += e.vx;
    if (e.x < e.plat.x)              { e.x = e.plat.x;              e.vx *= -1; }
    if (e.x+e.w > e.plat.x+e.plat.w) { e.x = e.plat.x+e.plat.w-e.w; e.vx *= -1; }

    if (player.invincible > 0 || !overlap(player, e)) continue;

    const fromTop    = player.vy > 0 && player.y + player.h < e.y + e.h * 0.55;
    const fromBottom = player.vy < 0 && player.y > e.y + e.h * 0.45;
    const stomped = fromTop || fromBottom;
    if (fromBottom) player.vy = 4; // bounce back down after head-butt
    if (stomped) {
      e.alive = false;
      player.vy = -10;
      if (e.isCorrect) {
        score += 10;
        celebrating = true; celebTimer = 130;
        spawnBurst(e.x + e.w/2, e.y + e.h/2, '#FFD700', 20);
        sfxCorrect();
        shiftWorld();
        setTimeout(() => { if (gameState === 'playing') spawnQuestion(); }, 1200);
      } else {
        spawnBurst(e.x + e.w/2, e.y + e.h/2, '#FF6060', 10);
        sfxWrong();
      }
    } else {
      loseLife(); return;
    }
  }

  if (celebrating && --celebTimer <= 0) celebrating = false;

  particles = particles.filter(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life -= 0.022;
    return p.life > 0;
  });
}

function loseLife() {
  lives--;
  sfxHit();
  spawnBurst(player.x + player.w/2, player.y + player.h/2, '#FF6600', 12);
  if (lives <= 0) { gameState = 'gameover'; return; }
  player.x = 60; player.y = 395;
  player.vx = 0; player.vy = 0;
  player.invincible = 120;
}

function spawnBurst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = (Math.PI * 2 * i) / n + Math.random() * 0.4;
    const s = 2.5 + Math.random() * 3.5;
    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - 1, life: 1, color, r: 4+Math.random()*3 });
  }
}

// ─── Draw ─────────────────────────────────────────────────────────────────────
const CLOUD_DEFS = [[90,80,70],[360,55,90],[620,85,60],[500,130,50]];

function draw() {
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#4FC3F7'); sky.addColorStop(1, '#E1F5FE');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = 'rgba(255,255,255,0.88)';
  for (const [cx,cy,cr] of CLOUD_DEFS) drawCloud(cx,cy,cr);

  for (const p of platforms) drawPlatform(p);
  for (const e of enemies)   { if (e.alive) drawEnemy(e); }
  drawPlayer(player.x, player.y);

  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  drawHUD();
  if (gameState === 'gameover') drawGameOver();
}

function drawCloud(cx, cy, r) {
  ctx.beginPath();
  ctx.arc(cx, cy, r*.50, 0, Math.PI*2);
  ctx.arc(cx+r*.45, cy-r*.10, r*.38, 0, Math.PI*2);
  ctx.arc(cx-r*.32, cy+r*.10, r*.30, 0, Math.PI*2);
  ctx.arc(cx+r*.10, cy-r*.28, r*.30, 0, Math.PI*2);
  ctx.fill();
}

function drawPlatform(p) {
  if (p.isGround) {
    ctx.fillStyle = '#56C42A'; ctx.fillRect(p.x, p.y, p.w, 14);
    ctx.fillStyle = '#8B5E3C'; ctx.fillRect(p.x, p.y+14, p.w, p.h-14);
    ctx.fillStyle = '#6ED636';
    for (let gx = 8; gx < p.w; gx += 18) {
      ctx.beginPath(); ctx.arc(p.x+gx, p.y+2, 5, Math.PI, 0); ctx.fill();
    }
  } else {
    ctx.fillStyle = '#D4793B'; ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.fillStyle = '#BF6025'; ctx.fillRect(p.x, p.y+p.h/2, p.w, 2);
    let off = 0;
    for (let row = 0; row < 2; row++) {
      for (let bx = p.x+off; bx < p.x+p.w; bx += 48) ctx.fillRect(bx, p.y+row*(p.h/2), 2, p.h/2);
      off = off === 0 ? 24 : 0;
    }
    ctx.fillStyle = 'rgba(255,220,150,0.22)'; ctx.fillRect(p.x, p.y, p.w, 4);
  }
}

function drawPlayer(px, py) {
  if (player.invincible > 0 && Math.floor(player.invincible/5) % 2 === 0) return;
  ctx.save();
  if (player.facing === -1) {
    ctx.translate(px + player.w/2, 0);
    ctx.scale(-1, 1);
    ctx.translate(-(px + player.w/2), 0);
  }

  const legOff = player.onGround ? (player.animFrame === 1 ? 2 : -2) : 0;

  // Sneakers
  ctx.fillStyle = '#111111';
  ctx.fillRect(px+2,  py+39+legOff, 13, 5);
  ctx.fillRect(px+19, py+39-legOff, 13, 5);
  ctx.fillStyle = '#E8E8E8';
  ctx.fillRect(px+2,  py+42+legOff, 13, 2);
  ctx.fillRect(px+19, py+42-legOff, 13, 2);
  ctx.fillStyle = '#2a2a2a';
  ctx.fillRect(px+3,  py+40+legOff, 5, 2);
  ctx.fillRect(px+20, py+40-legOff, 5, 2);

  // Legs
  ctx.fillStyle = '#F0C8A0';
  ctx.fillRect(px+5,  py+35+legOff, 9, 6);
  ctx.fillRect(px+20, py+35-legOff, 9, 6);

  // Dark navy pleated skirt
  ctx.fillStyle = '#111827'; ctx.fillRect(px, py+28, 36, 12);
  ctx.fillStyle = '#1a2436';
  for (let sx = px+4; sx < px+34; sx += 5) ctx.fillRect(sx, py+28, 2, 12);
  ctx.fillStyle = '#1f2d45'; ctx.fillRect(px, py+28, 36, 3);

  // White polo body
  ctx.fillStyle = '#F5F5F5'; ctx.fillRect(px+4, py+19, 26, 11);
  ctx.fillStyle = '#E0E0E0';
  ctx.fillRect(px+4,  py+19, 3, 11);
  ctx.fillRect(px+27, py+19, 3, 11);

  // Navy collar with yellow trim
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(px+11, py+17, 7, 6);
  ctx.fillRect(px+18, py+17, 7, 6);
  ctx.fillStyle = '#F59E0B';
  ctx.fillRect(px+11, py+17, 7, 2);
  ctx.fillRect(px+18, py+17, 7, 2);
  ctx.fillStyle = '#F5F5F5'; ctx.fillRect(px+16, py+18, 4, 5);

  // Two buttons
  ctx.fillStyle = '#111111';
  ctx.fillRect(px+17, py+22, 2, 2);
  ctx.fillRect(px+17, py+26, 2, 2);

  // Chest pocket + badge
  ctx.fillStyle = '#E8E8E8'; ctx.fillRect(px+7, py+22, 7, 6);
  ctx.strokeStyle = '#CCC'; ctx.lineWidth = 1; ctx.strokeRect(px+7, py+22, 7, 6);
  ctx.fillStyle = '#0f172a'; ctx.fillRect(px+8, py+23, 5, 4);
  ctx.fillStyle = '#F59E0B'; ctx.fillRect(px+9, py+24, 3, 2);

  // Sleeve trim
  ctx.fillStyle = '#F59E0B';
  ctx.fillRect(px+4,  py+27, 3, 2);
  ctx.fillRect(px+27, py+27, 3, 2);
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(px+4,  py+29, 3, 1);
  ctx.fillRect(px+27, py+29, 3, 1);

  // Neck
  ctx.fillStyle = '#F0C8A0'; ctx.fillRect(px+14, py+15, 8, 5);

  // Hair pulled back
  ctx.fillStyle = '#3D2008';
  ctx.fillRect(px+6,  py,    24, 7);
  ctx.fillRect(px+4,  py+4,  5,  10);
  ctx.fillRect(px+27, py+4,  5,  10);
  ctx.fillRect(px+29, py+8,  6,  8);
  ctx.fillStyle = '#2a1505'; ctx.fillRect(px+30, py+9, 4, 6);

  // Face
  ctx.fillStyle = '#F0C8A0'; ctx.fillRect(px+7, py+5, 22, 14);
  ctx.fillStyle = 'rgba(240,140,140,0.45)';
  ctx.fillRect(px+7,  py+13, 5, 4);
  ctx.fillRect(px+24, py+13, 5, 4);

  // White headband
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(px+5, py+4, 26, 4);
  ctx.fillStyle = '#E5E5E5';
  ctx.fillRect(px+5, py+4, 26, 1);
  ctx.fillRect(px+5, py+7, 26, 1);

  // Eyes
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(px+10, py+9, 5, 5);
  ctx.fillRect(px+21, py+9, 5, 5);
  ctx.fillStyle = '#5C3317';
  ctx.fillRect(px+11, py+10, 3, 3);
  ctx.fillRect(px+22, py+10, 3, 3);
  ctx.fillStyle = 'white';
  ctx.fillRect(px+12, py+10, 1, 1);
  ctx.fillRect(px+23, py+10, 1, 1);

  // Eyebrows
  ctx.fillStyle = '#3D2008';
  ctx.fillRect(px+10, py+7, 5, 2);
  ctx.fillRect(px+21, py+7, 5, 2);

  // Smile
  ctx.fillStyle = '#C27B5A';
  ctx.fillRect(px+11, py+15, 14, 2);
  ctx.fillRect(px+10, py+13,  3,  3);
  ctx.fillRect(px+23, py+13,  3,  3);
  ctx.fillStyle = 'white'; ctx.fillRect(px+12, py+15, 12, 2);

  ctx.restore();
}

function drawEnemy(e) {
  const cx  = e.x + e.w / 2;
  const cy  = e.y + e.h / 2;
  const bob = Math.sin(Date.now() / 280 + e.x) * 3;
  const face = e.vx > 0 ? 1 : -1; // facing direction

  ctx.save();
  ctx.translate(cx, cy + bob);
  if (face === -1) ctx.scale(-1, 1);

  // Glow ring
  ctx.strokeStyle = e.isCorrect ? '#4ade80' : '#f87171';
  ctx.lineWidth = 2.5;
  ctx.globalAlpha = 0.5 + Math.sin(Date.now() / 180) * 0.3;
  ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI * 2); ctx.stroke();
  ctx.globalAlpha = 1;

  if (e.type === 'fish') {
    // Body
    ctx.fillStyle = e.isCorrect ? '#f97316' : '#e11d48';
    ctx.beginPath(); ctx.ellipse(0, 0, 24, 16, 0, 0, Math.PI * 2); ctx.fill();
    // Tail fin
    ctx.fillStyle = e.isCorrect ? '#ea580c' : '#be123c';
    ctx.beginPath();
    ctx.moveTo(22, 0); ctx.lineTo(34, -12); ctx.lineTo(34, 12); ctx.closePath(); ctx.fill();
    // Top fin
    ctx.fillStyle = e.isCorrect ? '#fb923c' : '#f43f5e';
    ctx.beginPath();
    ctx.moveTo(0, -16); ctx.lineTo(-8, -26); ctx.lineTo(8, -26); ctx.closePath(); ctx.fill();
    // Scales
    ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 1;
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath(); ctx.arc(i * 10, 2, 7, 0, Math.PI); ctx.stroke();
    }
    // Eye
    ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(-12, -4, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1e293b'; ctx.beginPath(); ctx.arc(-11, -4, 3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'white'; ctx.fillRect(-11, -6, 1, 1);

  } else if (e.type === 'octopus') {
    // Tentacles
    const tentColors = e.isCorrect ? ['#7c3aed','#6d28d9'] : ['#dc2626','#b91c1c'];
    for (let i = -3; i <= 3; i++) {
      ctx.strokeStyle = tentColors[0]; ctx.lineWidth = 5; ctx.lineCap = 'round';
      const tx = i * 7;
      ctx.beginPath();
      ctx.moveTo(tx, 12);
      ctx.quadraticCurveTo(tx + Math.sin(Date.now()/300 + i) * 8, 26, tx + Math.sin(Date.now()/400 + i) * 5, 36);
      ctx.stroke();
    }
    // Body
    ctx.fillStyle = e.isCorrect ? '#8b5cf6' : '#ef4444';
    ctx.beginPath(); ctx.ellipse(0, -4, 20, 18, 0, 0, Math.PI * 2); ctx.fill();
    // Head bump
    ctx.fillStyle = e.isCorrect ? '#a78bfa' : '#f87171';
    ctx.beginPath(); ctx.ellipse(0, -14, 14, 10, 0, 0, Math.PI * 2); ctx.fill();
    // Eyes
    ctx.fillStyle = 'white';
    ctx.beginPath(); ctx.arc(-7, -6, 5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(7, -6, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1e293b';
    ctx.beginPath(); ctx.arc(-6, -6, 3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(8, -6, 3, 0, Math.PI * 2); ctx.fill();

  } else if (e.type === 'shark') {
    // Body
    ctx.fillStyle = e.isCorrect ? '#64748b' : '#dc2626';
    ctx.beginPath(); ctx.ellipse(0, 2, 28, 14, 0, 0, Math.PI * 2); ctx.fill();
    // Belly
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath(); ctx.ellipse(0, 6, 20, 8, 0, 0, Math.PI * 2); ctx.fill();
    // Dorsal fin
    ctx.fillStyle = e.isCorrect ? '#475569' : '#b91c1c';
    ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(-10, -26); ctx.lineTo(10, -14); ctx.closePath(); ctx.fill();
    // Tail
    ctx.fillStyle = e.isCorrect ? '#475569' : '#b91c1c';
    ctx.beginPath(); ctx.moveTo(26, 2); ctx.lineTo(38, -10); ctx.lineTo(38, 14); ctx.closePath(); ctx.fill();
    // Snout
    ctx.fillStyle = e.isCorrect ? '#64748b' : '#dc2626';
    ctx.beginPath(); ctx.ellipse(-26, 2, 8, 5, 0, 0, Math.PI * 2); ctx.fill();
    // Mouth
    ctx.strokeStyle = 'white'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(-24, 4, 5, 0.1, Math.PI - 0.1); ctx.stroke();
    // Teeth
    ctx.fillStyle = 'white';
    for (let t = -28; t <= -20; t += 4) {
      ctx.beginPath(); ctx.moveTo(t, 2); ctx.lineTo(t + 2, 6); ctx.lineTo(t + 4, 2); ctx.fill();
    }
    // Eye
    ctx.fillStyle = '#1e293b'; ctx.beginPath(); ctx.arc(-16, -2, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'white'; ctx.fillRect(-16, -4, 1, 1);

  } else if (e.type === 'whale') {
    // Body
    ctx.fillStyle = e.isCorrect ? '#0284c7' : '#7c3aed';
    ctx.beginPath(); ctx.ellipse(0, 0, 30, 20, 0, 0, Math.PI * 2); ctx.fill();
    // Belly
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath(); ctx.ellipse(0, 8, 20, 10, 0, 0, Math.PI * 2); ctx.fill();
    // Tail
    ctx.fillStyle = e.isCorrect ? '#0369a1' : '#6d28d9';
    ctx.beginPath(); ctx.moveTo(28, 0); ctx.lineTo(40, -14); ctx.lineTo(42, 0); ctx.lineTo(40, 14); ctx.closePath(); ctx.fill();
    // Fin
    ctx.fillStyle = e.isCorrect ? '#0369a1' : '#6d28d9';
    ctx.beginPath(); ctx.moveTo(8, -20); ctx.lineTo(-4, -32); ctx.lineTo(-8, -18); ctx.closePath(); ctx.fill();
    // Spout
    ctx.strokeStyle = '#bae6fd'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    const sp = Date.now() / 200;
    ctx.beginPath(); ctx.moveTo(-18, -18); ctx.lineTo(-20 + Math.sin(sp)*3, -32); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-14, -20); ctx.lineTo(-13 + Math.sin(sp+1)*3, -34); ctx.stroke();
    // Mouth / smile
    ctx.strokeStyle = 'white'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(-20, 2, 7, -0.4, 0.6); ctx.stroke();
    // Eye
    ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(-16, -6, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1e293b'; ctx.beginPath(); ctx.arc(-15, -6, 2.5, 0, Math.PI * 2); ctx.fill();

  } else if (e.type === 'dolphin') {
    // Body
    ctx.fillStyle = e.isCorrect ? '#06b6d4' : '#f97316';
    ctx.beginPath(); ctx.ellipse(0, 0, 28, 14, 0.1, 0, Math.PI * 2); ctx.fill();
    // Belly
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath(); ctx.ellipse(0, 4, 18, 8, 0, 0, Math.PI * 2); ctx.fill();
    // Dorsal fin
    ctx.fillStyle = e.isCorrect ? '#0891b2' : '#ea580c';
    ctx.beginPath(); ctx.moveTo(4, -14); ctx.lineTo(-4, -26); ctx.lineTo(12, -14); ctx.closePath(); ctx.fill();
    // Tail
    ctx.fillStyle = e.isCorrect ? '#0891b2' : '#ea580c';
    ctx.beginPath(); ctx.moveTo(26, 0); ctx.lineTo(38, -10); ctx.lineTo(36, 0); ctx.lineTo(38, 10); ctx.closePath(); ctx.fill();
    // Rostrum (beak)
    ctx.fillStyle = e.isCorrect ? '#06b6d4' : '#f97316';
    ctx.beginPath(); ctx.moveTo(-26, 0); ctx.lineTo(-40, -3); ctx.lineTo(-40, 3); ctx.closePath(); ctx.fill();
    // Smile
    ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(-30, 2, 8, -0.3, 0.5); ctx.stroke();
    // Eye
    ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(-18, -4, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1e293b'; ctx.beginPath(); ctx.arc(-17, -4, 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'white'; ctx.fillRect(-17, -5, 1, 1);

  } else if (e.type === 'mushroom') {
    // Stem
    ctx.fillStyle = e.isCorrect ? '#fef3c7' : '#fde68a';
    ctx.fillRect(-12, 4, 24, 20);
    ctx.fillStyle = 'rgba(0,0,0,0.1)';
    ctx.fillRect(-12, 4, 4, 20); ctx.fillRect(8, 4, 4, 20);
    // Cap
    ctx.fillStyle = e.isCorrect ? '#16a34a' : '#dc2626';
    ctx.beginPath(); ctx.ellipse(0, 2, 26, 20, 0, Math.PI, 0); ctx.fill();
    // Spots
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.beginPath(); ctx.arc(-10, -8, 5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(8, -12, 4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(14, -4, 3, 0, Math.PI * 2); ctx.fill();
    // Cap rim
    ctx.fillStyle = e.isCorrect ? '#15803d' : '#b91c1c';
    ctx.beginPath(); ctx.ellipse(0, 2, 26, 6, 0, Math.PI, 0); ctx.fill();
    // Eyes on stem
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(-6, 8, 4, 5); ctx.fillRect(2, 8, 4, 5);
    ctx.fillStyle = 'white';
    ctx.fillRect(-5, 9, 2, 2); ctx.fillRect(3, 9, 2, 2);
    // Smile
    ctx.strokeStyle = '#92400e'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, 16, 5, 0.1, Math.PI - 0.1); ctx.stroke();

  } else if (e.type === 'toast') {
    // Toast body
    ctx.fillStyle = e.isCorrect ? '#fbbf24' : '#f97316';
    ctx.beginPath();
    ctx.roundRect(-20, -18, 40, 36, 6);
    ctx.fill();
    // Crust (darker border)
    ctx.strokeStyle = e.isCorrect ? '#d97706' : '#ea580c';
    ctx.lineWidth = 4; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.roundRect(-20, -18, 40, 36, 6); ctx.stroke();
    // Inner bread colour
    ctx.fillStyle = e.isCorrect ? '#fef3c7' : '#fed7aa';
    ctx.beginPath(); ctx.roundRect(-15, -13, 30, 26, 3); ctx.fill();
    // Shine lines
    ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-10, -10); ctx.lineTo(-10, 10); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-4, -12); ctx.lineTo(-4, 12); ctx.stroke();
    // Eyes
    ctx.fillStyle = '#92400e';
    ctx.beginPath(); ctx.arc(-7, -2, 4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(7, -2, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'white';
    ctx.beginPath(); ctx.arc(-6, -3, 2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(8, -3, 2, 0, Math.PI * 2); ctx.fill();
    // Smile
    ctx.strokeStyle = '#92400e'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 6, 7, 0.2, Math.PI - 0.2); ctx.stroke();

  } else if (e.type === 'bucket') {
    // Bucket body (trapezoid)
    ctx.fillStyle = e.isCorrect ? '#7c3aed' : '#6d28d9';
    ctx.beginPath();
    ctx.moveTo(-18, -16); ctx.lineTo(18, -16);
    ctx.lineTo(14, 18);   ctx.lineTo(-14, 18);
    ctx.closePath(); ctx.fill();
    // Bucket rim
    ctx.fillStyle = e.isCorrect ? '#8b5cf6' : '#7c3aed';
    ctx.fillRect(-20, -22, 40, 8);
    ctx.strokeStyle = e.isCorrect ? '#a78bfa' : '#8b5cf6';
    ctx.lineWidth = 2; ctx.strokeRect(-20, -22, 40, 8);
    // Stripes
    ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 3;
    for (let sx = -12; sx <= 12; sx += 8) {
      ctx.beginPath();
      ctx.moveTo(sx, -16);
      ctx.lineTo(sx * (14/18), 18);
      ctx.stroke();
    }
    // Handle
    ctx.strokeStyle = e.isCorrect ? '#a78bfa' : '#8b5cf6';
    ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(0, -22, 14, Math.PI, 0); ctx.stroke();
    // Eyes
    ctx.fillStyle = 'white';
    ctx.beginPath(); ctx.arc(-6, -4, 5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(6, -4, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1e293b';
    ctx.beginPath(); ctx.arc(-5, -4, 3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(7, -4, 3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'white'; ctx.fillRect(-5, -5, 1, 1); ctx.fillRect(7, -5, 1, 1);
    // Smile
    ctx.strokeStyle = 'white'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, 6, 6, 0.2, Math.PI - 0.2); ctx.stroke();
  }

  // Number label
  ctx.fillStyle = 'white';
  ctx.font = `bold ${e.num >= 10 ? 16 : 20}px Arial`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,0.7)'; ctx.shadowBlur = 5;
  ctx.fillText(e.num, 0, 2);
  ctx.shadowBlur = 0;

  ctx.restore();
}

function drawHUD() {
  ctx.fillStyle = 'rgba(0,0,20,0.72)'; ctx.fillRect(0, 0, W, 80);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  if (celebrating) {
    const pulse = 1 + Math.sin(celebTimer * 0.18) * 0.06;
    ctx.save();
    ctx.translate(W/2, 40); ctx.scale(pulse, pulse);
    ctx.font = 'bold 42px Arial'; ctx.fillStyle = '#FFD700';
    ctx.fillText(`⭐  ${question.a} + ${question.b} = ${question.answer}  ⭐  ¡CORRECTO!`, 0, 0);
    ctx.restore();
  } else {
    ctx.font = 'bold 52px Arial'; ctx.fillStyle = '#FFFFFF';
    ctx.shadowColor = 'rgba(255,215,0,0.5)'; ctx.shadowBlur = 12;
    ctx.fillText(`${question.a}  +  ${question.b}  =  ?`, W/2, 40);
    ctx.shadowBlur = 0;
  }

  ctx.font = 'bold 22px Arial'; ctx.textAlign = 'left'; ctx.fillStyle = '#EF4444';
  ctx.fillText('♥'.repeat(lives), 12, 29);
  ctx.textAlign = 'right'; ctx.fillStyle = '#FFD700';
  ctx.fillText(`⭐ ${score}`, W-12, 29);
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.78)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#EF4444'; ctx.font = 'bold 62px Arial';
  ctx.fillText('¡FIN DEL JUEGO!', W/2, H/2 - 55);
  ctx.fillStyle = '#FFD700'; ctx.font = 'bold 32px Arial';
  ctx.fillText(`⭐ PUNTAJE: ${score}`, W/2, H/2 + 5);
  ctx.fillStyle = '#4ADE80'; ctx.font = '24px Arial';
  if (Math.floor(Date.now()/600) % 2 === 0)
    ctx.fillText('PRESIONA  ENTER  PARA JUGAR DE NUEVO', W/2, H/2 + 62);
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function shuffle(arr)   { return arr.sort(() => Math.random() - 0.5); }

// ─── Loop ─────────────────────────────────────────────────────────────────────
function loop() { update(); draw(); requestAnimationFrame(loop); }
resetGame();
loop();

  function toggleRules() {
    const o = document.getElementById('rules-overlay');
    o.style.display = o.style.display === 'none' ? 'flex' : 'none';
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      const o = document.getElementById('rules-overlay');
      if (o) o.style.display = 'none';
    }
  });
</script>
