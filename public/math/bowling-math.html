<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bolos Matemáticos – MicaGames</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      background:#0f0f1a;
      min-height:100vh;
      display:flex; flex-direction:column; align-items:center;
      font-family:'Arial Rounded MT Bold', Arial, sans-serif;
      overflow-y:auto; overflow-x:hidden;
      user-select:none;
    }

    canvas#bg { position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; }
    .confetti-layer { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:50; }

    #game {
      position:relative; z-index:1;
      display:flex; flex-direction:column;
      align-items:center; gap:18px;
      padding:20px 16px 36px;
      width:100%; max-width:640px;
    }

    /* ── Top bar ── */
    #topbar { display:flex; align-items:center; gap:14px; width:100%; }
    .home-btn {
      text-decoration:none;
      background:rgba(255,255,255,0.08);
      border:2px solid rgba(255,255,255,0.15);
      border-radius:50%; width:44px; height:44px;
      display:flex; align-items:center; justify-content:center; font-size:1.3rem;
      transition:border-color .15s, background .15s;
    }
    .home-btn:hover { border-color:#FFD700; background:rgba(255,215,0,.1); }
    .page-title {
      color:#FFD700; font-size:21px;
      text-shadow:0 0 20px rgba(255,215,0,.4), 2px 2px 0 #b8860b;
      letter-spacing:1px;
    }

    /* ── HUD ── */
    #hud { display:flex; gap:28px; align-items:center; }
    .hud-box { text-align:center; }
    .hud-label { color:#64748b; font-size:11px; letter-spacing:2px; text-transform:uppercase; }
    .hud-value { color:#FFD700; font-size:26px; font-weight:bold; text-shadow:0 0 14px rgba(255,215,0,.4); }

    #level-badge {
      background:rgba(255,215,0,.1); border:2px solid rgba(255,215,0,.3);
      color:#FFD700; font-size:13px; letter-spacing:2px;
      padding:5px 16px; border-radius:20px;
    }

    /* ── Equation card ── */
    #eq-card {
      width:100%;
      background:rgba(255,255,255,.05);
      border:2px solid rgba(255,255,255,.1);
      border-radius:24px;
      padding:18px 16px;
      display:flex; flex-direction:column;
      align-items:center; gap:8px;
      transition:border-color .3s, box-shadow .3s;
    }
    #eq-card.correct { border-color:#22c55e; box-shadow:0 0 36px rgba(34,197,94,.25); }
    #eq-card.wrong   { border-color:#ef4444; box-shadow:0 0 36px rgba(239,68,68,.2); }

    #equation {
      font-size:2.2rem; font-weight:bold; letter-spacing:2px; color:#e2e8f0;
    }
    #equation .blank {
      display:inline-flex; align-items:center; justify-content:center;
      min-width:52px; height:52px; padding:0 10px;
      background:rgba(255,215,0,.1); border:3px dashed rgba(255,215,0,.5);
      border-radius:12px; color:#FFD700; vertical-align:middle;
      animation:pulseBlank 1.1s ease-in-out infinite;
    }
    @keyframes pulseBlank {
      0%,100%{ box-shadow:0 0 0 0 rgba(255,215,0,.3); }
      50%    { box-shadow:0 0 0 10px rgba(255,215,0,0); }
    }
    #eq-hint { font-size:12px; color:#64748b; text-align:center; }

    /* ── Lane ── */
    #lane-wrap {
      position:relative;
      width:100%;
      background:linear-gradient(180deg,#3b2410 0%,#5c3a1a 60%,#7a4d21 100%);
      border-radius:20px;
      padding:26px 16px 40px;
      overflow:hidden;
      box-shadow: inset 0 4px 20px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.4);
      min-height:280px;
    }
    #lane-wrap::before {
      content:''; position:absolute; left:50%; top:0; bottom:0; width:2px;
      background:rgba(255,255,255,.08); transform:translateX(-50%);
    }

    #pin-rack {
      position:relative;
      width:220px; height:150px;
      margin:0 auto 10px;
    }
    .pin {
      position:absolute;
      width:26px; height:52px;
      left:50%; top:0;
      transform:translateX(-50%);
      cursor:pointer;
      transition:transform .3s cubic-bezier(.34,1.56,.64,1), opacity .4s;
    }
    .pin .pin-body {
      width:100%; height:100%;
      background:linear-gradient(180deg,#f8fafc 0%,#e2e8f0 60%,#f8fafc 100%);
      border-radius:50% 50% 40% 40% / 60% 60% 40% 40%;
      border:2px solid rgba(0,0,0,.15);
      box-shadow:0 3px 8px rgba(0,0,0,.4);
      position:relative;
    }
    .pin .pin-body::before {
      content:''; position:absolute; top:14px; left:0; right:0; height:6px;
      background:#ef4444;
    }
    .pin .pin-body::after {
      content:''; position:absolute; top:24px; left:0; right:0; height:4px;
      background:#ef4444; opacity:.7;
    }
    .pin.selected .pin-body {
      background:linear-gradient(180deg,#fecaca 0%,#ef4444 60%,#fecaca 100%);
      box-shadow:0 0 16px rgba(239,68,68,.8), 0 3px 8px rgba(0,0,0,.4);
    }
    .pin:hover:not(.knocked) { transform:translateX(-50%) scale(1.08); }
    .pin.knocked {
      transform:translateX(-50%) rotate(90deg) translateY(14px);
      opacity:.35;
      cursor:default;
    }
    .pin.bounce {
      animation:pinBounce .4s ease;
    }
    @keyframes pinBounce {
      0%,100%{ transform:translateX(-50%) rotate(0); }
      25%{ transform:translateX(-50%) rotate(-8deg); }
      75%{ transform:translateX(-50%) rotate(8deg); }
    }

    #ball-lane {
      position:relative;
      width:100%; height:56px;
      display:flex; align-items:center; justify-content:center;
    }
    #ball {
      width:44px; height:44px; border-radius:50%;
      background:radial-gradient(circle at 35% 30%, #93c5fd, #1d4ed8 60%, #1e3a8a);
      box-shadow:0 4px 10px rgba(0,0,0,.5);
      position:relative;
      cursor:pointer;
      transition:transform 1s cubic-bezier(.5,0,.5,1), box-shadow .15s;
    }
    #ball:hover { box-shadow:0 4px 16px rgba(59,130,246,.6); }
    #ball::before, #ball::after, #ball .hole3 {
      content:''; position:absolute; width:5px; height:5px; border-radius:50%;
      background:rgba(0,0,0,.5); top:14px;
    }
    #ball::before{ left:14px; }
    #ball::after{ left:22px; }
    #ball.rolling { transform:translateY(-210px); }

    #selected-count {
      font-size:13px; color:#94a3b8; text-align:center;
    }
    #selected-count b { color:#FFD700; }

    #roll-btn {
      padding:14px 40px;
      font-size:1.15rem; font-family:inherit; font-weight:bold; color:#1a1a1a;
      background:linear-gradient(90deg,#FFD700,#F59E0B);
      border:none; border-radius:50px; cursor:pointer;
      box-shadow:0 6px 24px rgba(255,215,0,.4);
      transition:transform .12s;
    }
    #roll-btn:hover:not(:disabled) { transform:scale(1.06); }
    #roll-btn:disabled { opacity:.5; cursor:default; }

    /* ── Message ── */
    #message {
      font-size:16px; font-weight:bold; letter-spacing:1px;
      min-height:24px; text-align:center; color:#e2e8f0;
    }
    #message.correct { color:#22c55e; text-shadow:0 0 12px rgba(34,197,94,.5); }
    #message.wrong   { color:#ef4444; text-shadow:0 0 12px rgba(239,68,68,.5); }

    /* ── Next button ── */
    #next-btn {
      display:none; padding:13px 44px;
      font-size:1.15rem; font-family:inherit; font-weight:bold; color:#1a1a1a;
      background:linear-gradient(90deg,#FFD700,#F59E0B);
      border:none; border-radius:50px; cursor:pointer;
      box-shadow:0 5px 22px rgba(255,215,0,.4);
      transition:transform .12s;
    }
    #next-btn:hover { transform:scale(1.07); }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>
  <canvas id="confetti-canvas" class="confetti-layer"></canvas>

  <div id="game">
    <div id="topbar">
      <a class="home-btn" href="index.html">🏠</a>
      <span class="page-title">🎳 BOLOS MATEMÁTICOS</span>
    </div>

    <div id="hud">
      <div class="hud-box">
        <div class="hud-label">Puntos</div>
        <div class="hud-value" id="score">0</div>
      </div>
      <div class="hud-box">
        <div class="hud-label">Racha</div>
        <div class="hud-value" id="streak">🔥 0</div>
      </div>
    </div>

    <div id="level-badge">NIVEL 1 — SUMAS</div>

    <div id="eq-card">
      <div id="equation"></div>
      <div id="eq-hint">¡TOCA LOS BOLOS QUE HAY QUE DERRIBAR PARA COMPLETAR LA CUENTA!</div>
    </div>

    <div id="lane-wrap">
      <div id="pin-rack"></div>
      <div id="ball-lane"><div id="ball" onclick="rollBall()"></div></div>
    </div>

    <div id="selected-count">Bolos seleccionados: <b id="sel-num">0</b></div>

    <button id="roll-btn" onclick="rollBall()">🎳 ¡LANZAR BOLA!</button>
    <div id="message">ELIGE CUÁNTOS BOLOS DERRIBAR</div>

    <button id="next-btn" onclick="nextQ()">SIGUIENTE ➡️</button>
  </div>

  <script>
    /* ── Starfield ── */
    const bgC=document.getElementById('bg'),bgX=bgC.getContext('2d');
    function rbg(){bgC.width=innerWidth;bgC.height=innerHeight;}
    rbg();window.addEventListener('resize',rbg);
    const stars=Array.from({length:160},()=>({x:Math.random(),y:Math.random(),r:.5+Math.random()*1.5,sp:.00008+Math.random()*.00015,tw:Math.random()*Math.PI*2}));
    const bgF=['🎳','+','−','×','=','?'].map(c=>({t:c,x:Math.random(),y:Math.random(),sp:.0001+Math.random()*.0002,sz:13+Math.random()*16,a:.04+Math.random()*.07}));
    function drawBg(){const W=bgC.width,H=bgC.height;bgX.fillStyle='#0f0f1a';bgX.fillRect(0,0,W,H);for(const s of stars){s.tw+=s.sp*60;bgX.globalAlpha=.4+Math.sin(s.tw)*.4;bgX.fillStyle='#fff';bgX.beginPath();bgX.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);bgX.fill();}for(const f of bgF){f.y-=f.sp;if(f.y<-.05)f.y=1.05;bgX.globalAlpha=f.a;bgX.fillStyle='#FFD700';bgX.font=`bold ${f.sz}px Arial`;bgX.textAlign='center';bgX.fillText(f.t,f.x*W,f.y*H);}bgX.globalAlpha=1;requestAnimationFrame(drawBg);}
    drawBg();

    /* ── Confetti ── */
    const cfC=document.getElementById('confetti-canvas'),cfX=cfC.getContext('2d');
    cfC.width=innerWidth;cfC.height=innerHeight;
    window.addEventListener('resize',()=>{cfC.width=innerWidth;cfC.height=innerHeight;});
    let cp=[];
    function burst(){const cols=['#FFD700','#22c55e','#3b82f6','#ec4899','#f97316','#8b5cf6'];for(let i=0;i<90;i++)cp.push({x:innerWidth/2+(Math.random()-.5)*340,y:innerHeight*.35,vx:(Math.random()-.5)*10,vy:-7-Math.random()*9,sz:6+Math.random()*8,col:cols[~~(Math.random()*cols.length)],rot:Math.random()*360,rv:(Math.random()-.5)*14,life:1});requestAnimationFrame(animCf);}
    function animCf(){cfX.clearRect(0,0,cfC.width,cfC.height);cp=cp.filter(p=>p.life>.02);for(const p of cp){p.vy+=.38;p.x+=p.vx;p.y+=p.vy;p.rot+=p.rv;p.life-=.018;cfX.save();cfX.globalAlpha=p.life;cfX.translate(p.x,p.y);cfX.rotate(p.rot*Math.PI/180);cfX.fillStyle=p.col;cfX.fillRect(-p.sz/2,-p.sz/2,p.sz,p.sz*.55);cfX.restore();}if(cp.length>0)requestAnimationFrame(animCf);else cfX.clearRect(0,0,cfC.width,cfC.height);}

    /* ── Pin rack layout: classic 4-3-2-1 triangle (10 pins) ── */
    const ROWS=[4,3,2,1]; // back row first
    const PIN_POSITIONS=(()=>{
      const positions=[];
      const rowGapY=34, colGapX=30;
      ROWS.forEach((count,rowIdx)=>{
        const y=rowIdx*rowGapY;
        const totalWidth=(count-1)*colGapX;
        for(let i=0;i<count;i++){
          positions.push({ x: -totalWidth/2 + i*colGapX, y });
        }
      });
      return positions;
    })();

    /* ── Level definitions: every missing value is 1-10 so it always maps to a pin count ── */
    const LEVELS=[
      { label:'1', desc:'SUMAS',    kind:'add-b' },
      { label:'2', desc:'SUMAS',    kind:'add-a' },
      { label:'3', desc:'RESTAS',   kind:'sub-b' },
      { label:'4', desc:'RESTAS',   kind:'sub-a' },
      { label:'5', desc:'MULTIPLICACIÓN', kind:'mul' },
    ];
    const ADVANCE=4;

    let score=0, streak=0, levelIdx=0, correctInLevel=0;
    let missing=1, equationParts=null, answered=false, rolling=false;
    let selected=new Set();

    function genQuestion(){
      const kind=LEVELS[levelIdx].kind;
      let a,b,c,parts;
      if(kind==='add-b'){
        missing=1+Math.floor(Math.random()*10);
        a=1+Math.floor(Math.random()*9);
        c=a+missing;
        parts=[String(a),'+','?','=',String(c)];
      } else if(kind==='add-a'){
        missing=1+Math.floor(Math.random()*10);
        b=1+Math.floor(Math.random()*9);
        c=missing+b;
        parts=['?','+',String(b),'=',String(c)];
      } else if(kind==='sub-b'){
        missing=1+Math.floor(Math.random()*10);
        c=Math.floor(Math.random()*10);
        a=c+missing;
        parts=[String(a),'−','?','=',String(c)];
      } else if(kind==='sub-a'){
        missing=1+Math.floor(Math.random()*10);
        b=Math.floor(Math.random()*10);
        c=missing-b< 0 ? missing : missing-b; // ensure c>=0
        a=c+b;
        parts=['?','−',String(b),'=',String(c)];
      } else { // mul
        missing=1+Math.floor(Math.random()*10);
        a=2+Math.floor(Math.random()*4); // 2..5
        c=a*missing;
        parts=[String(a),'×','?','=',String(c)];
      }
      equationParts=parts;
    }

    function renderEquation(){
      const el=document.getElementById('equation');
      el.innerHTML=equationParts.map(p=>p==='?'?'<span class="blank">?</span>':`<span>${p}</span>`).join(' ');
    }

    function buildPins(){
      const rack=document.getElementById('pin-rack');
      rack.innerHTML='';
      PIN_POSITIONS.forEach((pos,i)=>{
        const pin=document.createElement('div');
        pin.className='pin';
        pin.style.left=`calc(50% + ${pos.x}px)`;
        pin.style.top=pos.y+'px';
        pin.dataset.idx=i;
        pin.innerHTML='<div class="pin-body"></div>';
        pin.addEventListener('click', ()=>togglePin(pin));
        rack.appendChild(pin);
      });
    }

    function togglePin(pin){
      if(answered || rolling) return;
      const idx=pin.dataset.idx;
      if(selected.has(idx)){
        selected.delete(idx);
        pin.classList.remove('selected');
      } else {
        selected.add(idx);
        pin.classList.add('selected');
      }
      document.getElementById('sel-num').textContent=selected.size;
      updateBlank();
    }

    function updateBlank(){
      const blank=document.querySelector('#equation .blank');
      if(blank) blank.textContent = selected.size>0 ? selected.size : '?';
    }

    function resetPins(){
      selected=new Set();
      document.getElementById('sel-num').textContent='0';
      document.querySelectorAll('.pin').forEach(p=>{
        p.classList.remove('selected','knocked','bounce');
      });
    }

    function rollBall(){
      if(answered || rolling) return;
      rolling=true;
      document.getElementById('roll-btn').disabled=true;

      const ball=document.getElementById('ball');
      ball.classList.add('rolling');

      setTimeout(()=>{
        const ok = selected.size===missing;
        if(ok){
          answered=true;
          document.querySelectorAll('.pin.selected').forEach((p,i)=>{
            setTimeout(()=>p.classList.add('knocked'), i*70);
          });
          document.getElementById('eq-card').classList.add('correct');
          streak++; const bonus=streak>=3?20:10; score+=bonus;
          document.getElementById('score').textContent=score;
          document.getElementById('streak').textContent=`🔥 ${streak}`;
          const msg=streak>=5?`🏆 ¡RACHA DE ${streak}! +${bonus} PTS`:
                    streak>=3?`⭐ ¡GENIAL! RACHA DE ${streak}! +${bonus} PTS`:
                              `✅ ¡STRIKE MATEMÁTICO! DERRIBASTE ${missing}`;
          setMsg(msg,'correct');
          burst();
          correctInLevel++;
          if(correctInLevel>=ADVANCE && levelIdx<LEVELS.length-1){
            levelIdx++; correctInLevel=0; updateBadge();
            setTimeout(()=>setMsg(`🚀 ¡NIVEL ${LEVELS[levelIdx].label}! ${LEVELS[levelIdx].desc}`,'correct'),900);
          }
          document.getElementById('next-btn').style.display='inline-block';
        } else {
          document.querySelectorAll('.pin').forEach((p,i)=>{
            setTimeout(()=>{ p.classList.add('bounce'); setTimeout(()=>p.classList.remove('bounce'),400); }, i*20);
          });
          document.getElementById('eq-card').classList.add('wrong');
          streak=0; document.getElementById('streak').textContent='🔥 0';
          setMsg(`❌ ¡NO ERA! DERRIBASTE ${selected.size}, INTÉNTALO DE NUEVO`,'wrong');
          setTimeout(()=>{
            document.getElementById('eq-card').className='';
            setMsg('ELIGE CUÁNTOS BOLOS DERRIBAR','');
          },1300);
        }

        ball.classList.remove('rolling');
        rolling=false;
        document.getElementById('roll-btn').disabled=answered;
      }, 950);
    }

    function nextQ(){
      document.getElementById('next-btn').style.display='none';
      document.getElementById('eq-card').className='';
      answered=false;
      resetPins();
      genQuestion();
      renderEquation();
      document.getElementById('roll-btn').disabled=false;
      setMsg('ELIGE CUÁNTOS BOLOS DERRIBAR','');
    }

    function updateBadge(){
      const l=LEVELS[levelIdx];
      document.getElementById('level-badge').textContent=`NIVEL ${l.label} — ${l.desc}`;
    }
    function setMsg(t,c){const e=document.getElementById('message');e.textContent=t;e.className=c;}

    buildPins();
    nextQ();
  </script>
</body>
</html>
