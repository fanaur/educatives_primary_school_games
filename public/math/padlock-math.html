<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Abre el Candado – MicaGames</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      background:#0f0f1a;
      min-height:100vh;
      display:flex; flex-direction:column; align-items:center;
      font-family:'Arial Rounded MT Bold', Arial, sans-serif;
      overflow-y:auto; overflow-x:hidden;
      user-select:none;
    }

    canvas#bg { position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; }
    .confetti-layer { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:50; }

    #game {
      position:relative; z-index:1;
      display:flex; flex-direction:column;
      align-items:center; gap:18px;
      padding:20px 16px 36px;
      width:100%; max-width:560px;
    }

    /* ── Top bar ── */
    #topbar { display:flex; align-items:center; gap:14px; width:100%; }
    .home-btn {
      text-decoration:none;
      background:rgba(255,255,255,0.08);
      border:2px solid rgba(255,255,255,0.15);
      border-radius:50%; width:44px; height:44px;
      display:flex; align-items:center; justify-content:center; font-size:1.3rem;
      transition:border-color .15s, background .15s;
    }
    .home-btn:hover { border-color:#FFD700; background:rgba(255,215,0,.1); }
    .page-title {
      color:#FFD700; font-size:20px;
      text-shadow:0 0 20px rgba(255,215,0,.4), 2px 2px 0 #b8860b;
      letter-spacing:1px;
    }

    /* ── HUD ── */
    #hud { display:flex; gap:28px; align-items:center; }
    .hud-box { text-align:center; }
    .hud-label { color:#64748b; font-size:11px; letter-spacing:2px; text-transform:uppercase; }
    .hud-value { color:#FFD700; font-size:26px; font-weight:bold; text-shadow:0 0 14px rgba(255,215,0,.4); }

    #level-badge {
      background:rgba(255,215,0,.1); border:2px solid rgba(255,215,0,.3);
      color:#FFD700; font-size:13px; letter-spacing:2px;
      padding:5px 16px; border-radius:20px;
    }

    /* ── Padlock scene ── */
    #lock-scene {
      width:100%;
      background:rgba(255,255,255,.05);
      border:2px solid rgba(255,255,255,.1);
      border-radius:24px;
      padding:26px 16px 20px;
      display:flex; flex-direction:column; align-items:center; gap:18px;
    }

    #lock-svg-wrap { width:150px; height:150px; position:relative; }
    #shackle {
      position:absolute; top:0; left:26px; width:98px; height:70px;
      border:14px solid #cbd5e1; border-bottom:none;
      border-radius:50px 50px 0 0;
      transform-origin: 20px 60px;
      transition: transform .6s cubic-bezier(.34,1.56,.64,1);
      filter:drop-shadow(0 4px 6px rgba(0,0,0,.4));
    }
    #shackle.open { transform: rotate(-45deg) translate(-6px,-4px); }
    #lock-body {
      position:absolute; bottom:0; left:0; width:150px; height:96px;
      background:linear-gradient(180deg,#fbbf24 0%,#d97706 100%);
      border-radius:18px;
      box-shadow:0 8px 24px rgba(0,0,0,.4), inset 0 2px 4px rgba(255,255,255,.4);
      display:flex; align-items:center; justify-content:center;
    }
    #lock-body.unlocked { background:linear-gradient(180deg,#4ade80 0%,#16a34a 100%); }
    #keyhole { font-size:2.2rem; }

    /* ── Code slots ── */
    #code-slots {
      display:flex; gap:10px;
    }
    .slot {
      width:48px; height:56px;
      background:rgba(255,255,255,.06); border:3px solid rgba(255,255,255,.18);
      border-radius:12px;
      display:flex; align-items:center; justify-content:center;
      font-size:1.7rem; font-weight:bold; color:#475569;
      transition:border-color .3s, background .3s, color .3s, transform .3s;
    }
    .slot.filled {
      border-color:#22c55e; background:rgba(34,197,94,.18); color:#4ade80;
      transform:scale(1.08);
    }
    .slot.active {
      border-color:#FFD700; box-shadow:0 0 0 0 rgba(255,215,0,.3);
      animation:pulseSlot 1.1s ease-in-out infinite;
    }
    @keyframes pulseSlot {
      0%,100%{ box-shadow:0 0 0 0 rgba(255,215,0,.3); }
      50%    { box-shadow:0 0 0 8px rgba(255,215,0,0); }
    }

    /* ── Equation ── */
    #equation {
      font-size:2.1rem; font-weight:bold; letter-spacing:2px; color:#e2e8f0;
    }
    #equation .q { color:#FFD700; text-shadow:0 0 16px rgba(255,215,0,.6); }
    #progress-label { font-size:12px; color:#94a3b8; }
    #progress-label b { color:#FFD700; }

    /* ── Message ── */
    #message {
      font-size:16px; font-weight:bold; letter-spacing:1px;
      min-height:24px; text-align:center; color:#e2e8f0;
    }
    #message.correct { color:#22c55e; text-shadow:0 0 12px rgba(34,197,94,.5); }
    #message.wrong   { color:#ef4444; text-shadow:0 0 12px rgba(239,68,68,.5); }

    /* ── Numeric keypad ── */
    #keypad-wrap { display:flex; flex-direction:column; align-items:center; gap:14px; width:100%; }
    #keypad-display {
      min-width:120px; min-height:56px; padding:8px 20px;
      background:rgba(255,255,255,.06); border:3px solid rgba(255,255,255,.18);
      border-radius:16px; color:#FFD700; font-size:2rem; font-weight:bold;
      text-align:center; transition:border-color .15s, background .15s, color .15s;
    }
    #keypad-display.correct-fill { border-color:#22c55e; background:rgba(34,197,94,.15); color:#4ade80; }
    #keypad-display.wrong-fill   { border-color:#ef4444; background:rgba(239,68,68,.15); color:#f87171; animation:shake .4s ease; }
    #keypad { display:grid; grid-template-columns:repeat(3,64px); gap:10px; }
    .key-btn {
      width:64px; height:56px;
      font-size:1.4rem; font-family:inherit; font-weight:bold; color:#fff;
      background:rgba(59,130,246,.12); border:3px solid rgba(59,130,246,.35);
      border-radius:14px; cursor:pointer;
      transition:transform .1s, background .12s, border-color .12s;
    }
    .key-btn:hover:not(:disabled) { transform:scale(1.06); background:rgba(59,130,246,.28); border-color:#60a5fa; }
    .key-btn:disabled { opacity:.5; cursor:default; }
    .key-btn.key-back { background:rgba(239,68,68,.14); border-color:rgba(239,68,68,.4); }
    .key-btn.key-enter { background:linear-gradient(90deg,#FFD700,#F59E0B); border:none; color:#1a1a1a; }
    @keyframes shake {
      0%,100%{ transform:translateX(0); }
      20%{ transform:translateX(-8px); }
      40%{ transform:translateX(8px); }
      60%{ transform:translateX(-5px); }
      80%{ transform:translateX(5px); }
    }

    /* ── Next button ── */
    #next-btn {
      display:none; padding:13px 44px;
      font-size:1.15rem; font-family:inherit; font-weight:bold; color:#1a1a1a;
      background:linear-gradient(90deg,#FFD700,#F59E0B);
      border:none; border-radius:50px; cursor:pointer;
      box-shadow:0 5px 22px rgba(255,215,0,.4);
      transition:transform .12s;
    }
    #next-btn:hover { transform:scale(1.07); }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>
  <canvas id="confetti-canvas" class="confetti-layer"></canvas>

  <div id="game">
    <div id="topbar">
      <a class="home-btn" href="index.html">🏠</a>
      <span class="page-title">🔒 ABRE EL CANDADO</span>
    </div>

    <div id="hud">
      <div class="hud-box">
        <div class="hud-label">Puntos</div>
        <div class="hud-value" id="score">0</div>
      </div>
      <div class="hud-box">
        <div class="hud-label">Racha</div>
        <div class="hud-value" id="streak">🔥 0</div>
      </div>
    </div>

    <div id="level-badge">NIVEL 1 — SUMAS FÁCILES</div>

    <div id="lock-scene">
      <div id="lock-svg-wrap">
        <div id="shackle"></div>
        <div id="lock-body"><span id="keyhole">🔑</span></div>
      </div>
      <div id="code-slots"></div>
      <div id="progress-label"></div>
      <div id="equation"></div>
    </div>

    <div id="keypad-wrap">
      <div id="keypad-display">_</div>
      <div id="keypad">
        <button class="key-btn" data-k="1">1</button>
        <button class="key-btn" data-k="2">2</button>
        <button class="key-btn" data-k="3">3</button>
        <button class="key-btn" data-k="4">4</button>
        <button class="key-btn" data-k="5">5</button>
        <button class="key-btn" data-k="6">6</button>
        <button class="key-btn" data-k="7">7</button>
        <button class="key-btn" data-k="8">8</button>
        <button class="key-btn" data-k="9">9</button>
        <button class="key-btn key-back" data-k="back">⌫</button>
        <button class="key-btn" data-k="0">0</button>
        <button class="key-btn key-enter" data-k="enter">✓</button>
      </div>
    </div>
    <div id="message">¡RESUELVE LAS 4 SUMAS PARA ABRIR EL CANDADO!</div>

    <button id="next-btn" onclick="nextLock()">SIGUIENTE CANDADO ➡️</button>
  </div>

  <script>
    /* ── Starfield ── */
    const bgC=document.getElementById('bg'),bgX=bgC.getContext('2d');
    function rbg(){bgC.width=innerWidth;bgC.height=innerHeight;}
    rbg();window.addEventListener('resize',rbg);
    const stars=Array.from({length:160},()=>({x:Math.random(),y:Math.random(),r:.5+Math.random()*1.5,sp:.00008+Math.random()*.00015,tw:Math.random()*Math.PI*2}));
    const bgF=['🔒','🔑','+','=','?'].map(c=>({t:c,x:Math.random(),y:Math.random(),sp:.0001+Math.random()*.0002,sz:13+Math.random()*16,a:.04+Math.random()*.07}));
    function drawBg(){const W=bgC.width,H=bgC.height;bgX.fillStyle='#0f0f1a';bgX.fillRect(0,0,W,H);for(const s of stars){s.tw+=s.sp*60;bgX.globalAlpha=.4+Math.sin(s.tw)*.4;bgX.fillStyle='#fff';bgX.beginPath();bgX.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);bgX.fill();}for(const f of bgF){f.y-=f.sp;if(f.y<-.05)f.y=1.05;bgX.globalAlpha=f.a;bgX.fillStyle='#FFD700';bgX.font=`bold ${f.sz}px Arial`;bgX.textAlign='center';bgX.fillText(f.t,f.x*W,f.y*H);}bgX.globalAlpha=1;requestAnimationFrame(drawBg);}
    drawBg();

    /* ── Confetti ── */
    const cfC=document.getElementById('confetti-canvas'),cfX=cfC.getContext('2d');
    cfC.width=innerWidth;cfC.height=innerHeight;
    window.addEventListener('resize',()=>{cfC.width=innerWidth;cfC.height=innerHeight;});
    let cp=[];
    function burst(){const cols=['#FFD700','#22c55e','#3b82f6','#ec4899','#f97316','#8b5cf6'];for(let i=0;i<100;i++)cp.push({x:innerWidth/2+(Math.random()-.5)*340,y:innerHeight*.4,vx:(Math.random()-.5)*10,vy:-7-Math.random()*9,sz:6+Math.random()*8,col:cols[~~(Math.random()*cols.length)],rot:Math.random()*360,rv:(Math.random()-.5)*14,life:1});requestAnimationFrame(animCf);}
    function animCf(){cfX.clearRect(0,0,cfC.width,cfC.height);cp=cp.filter(p=>p.life>.02);for(const p of cp){p.vy+=.38;p.x+=p.vx;p.y+=p.vy;p.rot+=p.rv;p.life-=.018;cfX.save();cfX.globalAlpha=p.life;cfX.translate(p.x,p.y);cfX.rotate(p.rot*Math.PI/180);cfX.fillStyle=p.col;cfX.fillRect(-p.sz/2,-p.sz/2,p.sz,p.sz*.55);cfX.restore();}if(cp.length>0)requestAnimationFrame(animCf);else cfX.clearRect(0,0,cfC.width,cfC.height);}

    /* ── Levels: control the max size of the two addends in each addition.
       Every answer is kept 0-9 so each solved sum becomes one padlock digit. ── */
    const LEVELS=[
      { label:'1', desc:'SUMAS FÁCILES',   aMax:5, bMax:4 },
      { label:'2', desc:'SUMAS MEDIANAS',  aMax:7, bMax:6 },
      { label:'3', desc:'SUMAS GRANDES',   aMax:9, bMax:8 },
      { label:'4', desc:'¡MODO EXPERTO!',  aMax:9, bMax:9 },
    ];
    const ADVANCE=2; // padlocks fully solved before leveling up

    let score=0, streak=0, levelIdx=0, locksInLevel=0;
    let equations=[], code=[], slotIdx=0, answered=false;

    /* Build a set of 4 additions whose sums (0-9) form the padlock code. */
    function genLock(){
      const lvl=LEVELS[levelIdx];
      equations=[];
      code=[];
      for(let i=0;i<4;i++){
        let a,b,sum;
        do{
          a=1+Math.floor(Math.random()*lvl.aMax);
          b=Math.floor(Math.random()*lvl.bMax);
          sum=a+b;
        } while(sum>9);
        equations.push({a,b,sum});
        code.push(sum);
      }
      slotIdx=0;
    }

    function renderSlots(){
      const cont=document.getElementById('code-slots');
      cont.innerHTML='';
      for(let i=0;i<4;i++){
        const s=document.createElement('div');
        s.className='slot';
        if(i<slotIdx){ s.textContent=code[i]; s.classList.add('filled'); }
        else if(i===slotIdx){ s.textContent='?'; s.classList.add('active'); }
        else { s.textContent='?'; }
        cont.appendChild(s);
      }
    }

    function renderEquation(){
      const eq=equations[slotIdx];
      document.getElementById('equation').innerHTML=
        `${eq.a} + ${eq.b} = <span class="q">?</span>`;
      document.getElementById('progress-label').innerHTML=
        `Llave <b>${slotIdx+1}</b> de <b>4</b>`;
    }

    /* ── Numeric keypad ── */
    let typedValue='';
    function initKeypad(onSubmit){
      document.getElementById('keypad').addEventListener('click', e=>{
        const btn=e.target.closest('.key-btn');
        if(!btn || btn.disabled) return;
        const k=btn.dataset.k;
        if(k==='back'){ typedValue=typedValue.slice(0,-1); }
        else if(k==='enter'){ if(typedValue!=='') onSubmit(Number(typedValue)); return; }
        else { if(typedValue.length<2) typedValue+=k; }
        updateKeypadDisplay();
      });
    }
    function updateKeypadDisplay(){
      document.getElementById('keypad-display').textContent = typedValue===''?'_':typedValue;
    }
    function resetKeypad(){
      typedValue='';
      updateKeypadDisplay();
      document.getElementById('keypad-display').className='';
      document.querySelectorAll('.key-btn').forEach(b=>b.disabled=false);
    }
    function setKeypadEnabled(enabled){
      document.querySelectorAll('.key-btn').forEach(b=>b.disabled=!enabled);
    }

    function checkAnswer(val){
      if(answered) return;
      answered=true;
      setKeypadEnabled(false);
      const disp=document.getElementById('keypad-display');
      const correct=equations[slotIdx].sum;

      if(val===correct){
        disp.classList.add('correct-fill');
        streak++; const bonus=streak>=3?20:10; score+=bonus;
        document.getElementById('score').textContent=score;
        document.getElementById('streak').textContent=`🔥 ${streak}`;
        slotIdx++;
        renderSlots();

        if(slotIdx>=4){
          setMsg(`🔓 ¡CANDADO ABIERTO! +${bonus} PTS`,'correct');
          document.getElementById('shackle').classList.add('open');
          document.getElementById('lock-body').classList.add('unlocked');
          document.getElementById('equation').innerHTML='';
          document.getElementById('progress-label').innerHTML='¡LO LOGRASTE!';
          burst();
          locksInLevel++;
          if(locksInLevel>=ADVANCE && levelIdx<LEVELS.length-1){
            levelIdx++; locksInLevel=0; updateBadge();
            setTimeout(()=>setMsg(`🚀 ¡NIVEL ${LEVELS[levelIdx].label}! ${LEVELS[levelIdx].desc}`,'correct'),1000);
          }
          document.getElementById('next-btn').style.display='inline-block';
        } else {
          const msg=streak>=5?`🏆 ¡RACHA DE ${streak}! LLAVE ${slotIdx} LISTA`:
                    streak>=3?`⭐ ¡GENIAL! LLAVE ${slotIdx} LISTA`:
                              `✅ ¡CORRECTO! LLAVE ${slotIdx} LISTA`;
          setMsg(msg,'correct');
          renderEquation();
          answered=false;
          typedValue='';
          updateKeypadDisplay();
          disp.classList.remove('correct-fill');
          setKeypadEnabled(true);
        }
      } else {
        disp.classList.add('wrong-fill');
        streak=0; document.getElementById('streak').textContent='🔥 0';
        setMsg('❌ ¡INCORRECTO! INTÉNTALO DE NUEVO','wrong');
        setTimeout(()=>{
          answered=false;
          typedValue='';
          updateKeypadDisplay();
          disp.classList.remove('wrong-fill');
          setKeypadEnabled(true);
          setMsg('¡RESUELVE LAS 4 SUMAS PARA ABRIR EL CANDADO!','');
        }, 900);
      }
    }

    function nextLock(){
      document.getElementById('next-btn').style.display='none';
      document.getElementById('shackle').classList.remove('open');
      document.getElementById('lock-body').classList.remove('unlocked');
      answered=false;

      genLock();
      renderSlots();
      renderEquation();
      resetKeypad();
      setMsg('¡RESUELVE LAS 4 SUMAS PARA ABRIR EL CANDADO!','');
    }

    function updateBadge(){
      const l=LEVELS[levelIdx];
      document.getElementById('level-badge').textContent=`NIVEL ${l.label} — ${l.desc}`;
    }
    function setMsg(t,c){const e=document.getElementById('message');e.textContent=t;e.className=c;}

    initKeypad(checkAnswer);
    nextLock();
  </script>
</body>
</html>
