<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cadena de Imanes – MicaGames</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      background:#0f0f1a;
      min-height:100vh;
      display:flex; flex-direction:column; align-items:center;
      font-family:'Arial Rounded MT Bold', Arial, sans-serif;
      overflow-y:auto; overflow-x:hidden;
      user-select:none;
    }

    canvas#bg { position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; }
    .confetti-layer { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:50; }

    #game {
      position:relative; z-index:1;
      display:flex; flex-direction:column;
      align-items:center; gap:16px;
      padding:18px 14px 40px;
      width:100%; max-width:860px;
    }

    /* ── Top bar ── */
    #topbar { display:flex; align-items:center; gap:14px; width:100%; }
    .home-btn {
      text-decoration:none;
      background:rgba(255,255,255,0.08);
      border:2px solid rgba(255,255,255,0.15);
      border-radius:50%; width:44px; height:44px;
      display:flex; align-items:center; justify-content:center; font-size:1.3rem;
      transition:border-color .15s, background .15s;
    }
    .home-btn:hover { border-color:#FFD700; background:rgba(255,215,0,.1); }
    .page-title {
      color:#FFD700; font-size:20px;
      text-shadow:0 0 20px rgba(255,215,0,.4), 2px 2px 0 #b8860b;
      letter-spacing:1px;
    }

    /* ── HUD ── */
    #hud { display:flex; gap:28px; align-items:center; flex-wrap:wrap; justify-content:center; }
    .hud-box { text-align:center; }
    .hud-label { color:#64748b; font-size:11px; letter-spacing:2px; text-transform:uppercase; }
    .hud-value { color:#FFD700; font-size:26px; font-weight:bold; text-shadow:0 0 14px rgba(255,215,0,.4); }

    #hint {
      color:#64748b; font-size:13px; text-align:center; letter-spacing:.5px;
      max-width:600px;
    }

    /* ── Main card ── */
    #card {
      width:100%;
      background:rgba(255,255,255,.05);
      border:2px solid rgba(255,255,255,.1);
      border-radius:28px;
      padding:26px 16px 22px;
      display:flex; flex-direction:column;
      align-items:center; gap:20px;
      transition:border-color .3s, box-shadow .3s;
      overflow-x:auto;
    }
    #card.solved { border-color:#22c55e; box-shadow:0 0 40px rgba(34,197,94,.3); }

    /* ── Chain row ── */
    #chain-row {
      display:flex; align-items:center; justify-content:center;
      gap:6px; flex-wrap:nowrap; min-height:100px;
      width:100%; padding:0 8px;
    }

    .slot {
      width:84px; height:64px;
      border:3px dashed rgba(255,255,255,0.2);
      border-radius:12px;
      display:flex; align-items:center; justify-content:center;
      background: rgba(255,255,255,0.04);
      transition: background .15s, border-color .15s, transform .1s;
      flex-shrink:0;
      position:relative;
    }
    .slot.drag-over {
      border-color:#FFD700; border-style:solid;
      background:rgba(255,215,0,0.14);
      transform:scale(1.06);
    }
    .slot.filled { border-style:solid; border-color:rgba(255,255,255,.25); background:transparent; padding:0; }

    /* junction indicator between two slots */
    .junction {
      width:14px; height:14px; flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
      font-size:14px;
    }
    .junction.ok   { color:#22c55e; }
    .junction.bad  { color:#ef4444; }
    @keyframes shakeJ {
      0%,100%{ transform:translateX(0); }
      20%{ transform:translateX(-4px); }
      40%{ transform:translateX(4px); }
      60%{ transform:translateX(-3px); }
      80%{ transform:translateX(3px); }
    }
    .junction.bad.shake { animation: shakeJ .4s ease; }

    /* ── Magnet visual (shared by tiles + placed magnets) ── */
    .magnet {
      width:76px; height:52px;
      border-radius:10px;
      display:flex; overflow:hidden;
      box-shadow:0 4px 14px rgba(0,0,0,.45);
      border:2px solid rgba(255,255,255,.35);
      flex-shrink:0;
    }
    .magnet-half {
      flex:1; display:flex; align-items:center; justify-content:center;
      font-weight:bold; font-size:1.3rem; color:#fff;
      text-shadow:0 1px 3px rgba(0,0,0,.5);
    }
    .magnet-half.N { background:linear-gradient(135deg,#ef4444,#b91c1c); }
    .magnet-half.S { background:linear-gradient(135deg,#3b82f6,#1d4ed8); }

    .slot .magnet { cursor:pointer; }
    .slot .magnet:hover { filter:brightness(1.1); }

    @keyframes popIn {
      from { transform:scale(0) rotate(-20deg); opacity:0; }
      to   { transform:scale(1) rotate(0deg);   opacity:1; }
    }
    .magnet.new { animation: popIn .28s cubic-bezier(.175,.885,.32,1.275) both; }

    @keyframes snapPulse {
      0%   { box-shadow:0 4px 14px rgba(0,0,0,.45); filter:brightness(1); }
      50%  { box-shadow:0 0 26px rgba(34,197,94,.9); filter:brightness(1.35); }
      100% { box-shadow:0 4px 14px rgba(0,0,0,.45); filter:brightness(1); }
    }
    .magnet.snap { animation: snapPulse .55s ease; }

    /* ── Message ── */
    #message {
      font-size:16px; font-weight:bold; letter-spacing:.5px;
      min-height:26px; text-align:center; color:#e2e8f0;
    }
    #message.solved { color:#22c55e; text-shadow:0 0 12px rgba(34,197,94,.5); }
    #message.bad    { color:#ef4444; text-shadow:0 0 12px rgba(239,68,68,.5); }

    /* ── Next button ── */
    #next-btn {
      display:none; padding:13px 44px;
      font-size:1.15rem; font-family:inherit; font-weight:bold; color:#1a1a1a;
      background:linear-gradient(90deg,#FFD700,#F59E0B);
      border:none; border-radius:50px; cursor:pointer;
      box-shadow:0 5px 22px rgba(255,215,0,.4); transition:transform .12s;
    }
    #next-btn:hover { transform:scale(1.07); }

    /* ── Tile pool ── */
    #pool-label {
      color:#64748b; font-size:11px; letter-spacing:2px; text-transform:uppercase; text-align:center;
    }
    #tiles { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; max-width:560px; }
    .tile-wrap { display:flex; flex-direction:column; align-items:center; gap:4px; }
    .tile-hint { font-size:9px; color:#64748b; }
    .tile-wrap .magnet { cursor:grab; }
    .tile-wrap .magnet:hover { transform:scale(1.06); }
    .tile-wrap .magnet.dragging { opacity:.3; cursor:grabbing; }
    .tile-wrap.used { visibility:hidden; pointer-events:none; }

    #reset-btn {
      padding:10px 26px;
      font-size:.95rem; font-family:inherit; font-weight:bold; color:#f87171;
      background:rgba(239,68,68,.15); border:2px solid rgba(239,68,68,.4);
      border-radius:50px; cursor:pointer; transition:transform .12s, background .12s;
    }
    #reset-btn:hover { background:rgba(239,68,68,.28); transform:scale(1.05); }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>
  <canvas id="confetti-canvas" class="confetti-layer"></canvas>

  <div id="game">
    <div id="topbar">
      <a class="home-btn" href="index.html">🏠</a>
      <span class="page-title">🧲 CADENA DE IMANES</span>
    </div>

    <div id="hud">
      <div class="hud-box"><div class="hud-label">Puntos</div><div class="hud-value" id="score">0</div></div>
      <div class="hud-box"><div class="hud-label">Racha</div><div class="hud-value" id="streak">0</div></div>
      <div class="hud-box"><div class="hud-label">Nivel</div><div class="hud-value" id="level">1</div></div>
    </div>

    <div id="hint">💡 ¡ARRASTRA LOS IMANES A LOS ESPACIOS Y HAZ CLIC SOBRE UN IMÁN PARA GIRARLO! LOS POLOS OPUESTOS (N-S) SE ATRAEN, LOS IGUALES SE REPELEN.</div>

    <div id="card">
      <div id="chain-row"></div>
      <div id="message">¡ARRASTRA LOS IMANES Y ÚSALOS PARA QUE SE ATRAIGAN!</div>
    </div>

    <button id="next-btn" onclick="nextRound()">SIGUIENTE ➡️</button>

    <div id="pool-label">IMANES DISPONIBLES</div>
    <div id="tiles"></div>
    <button id="reset-btn" onclick="resetRound()">↩️ REINICIAR RONDA</button>
  </div>

  <script>
    /* ── Starfield ── */
    const bgC=document.getElementById('bg'),bgX=bgC.getContext('2d');
    function rbg(){bgC.width=innerWidth;bgC.height=innerHeight;}
    rbg();window.addEventListener('resize',rbg);
    const stars=Array.from({length:160},()=>({x:Math.random(),y:Math.random(),r:.5+Math.random()*1.5,sp:.00008+Math.random()*.00015,tw:Math.random()*Math.PI*2}));
    const bgF=['🧲','N','S','⚡'].map(c=>({t:c,x:Math.random(),y:Math.random(),sp:.0001+Math.random()*.0002,sz:14+Math.random()*16,a:.04+Math.random()*.07}));
    function drawBg(){const W=bgC.width,H=bgC.height;bgX.fillStyle='#0f0f1a';bgX.fillRect(0,0,W,H);for(const s of stars){s.tw+=s.sp*60;bgX.globalAlpha=.4+Math.sin(s.tw)*.4;bgX.fillStyle='#fff';bgX.beginPath();bgX.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);bgX.fill();}for(const f of bgF){f.y-=f.sp;if(f.y<-.05)f.y=1.05;bgX.globalAlpha=f.a;bgX.font=`${f.sz}px Arial`;bgX.textAlign='center';bgX.fillStyle='#FFD700';bgX.fillText(f.t,f.x*W,f.y*H);}bgX.globalAlpha=1;requestAnimationFrame(drawBg);}
    drawBg();

    /* ── Confetti ── */
    const cfC=document.getElementById('confetti-canvas'),cfX=cfC.getContext('2d');
    cfC.width=innerWidth;cfC.height=innerHeight;
    window.addEventListener('resize',()=>{cfC.width=innerWidth;cfC.height=innerHeight;});
    let cp=[];
    function burst(){const cols=['#FFD700','#22c55e','#3b82f6','#ec4899','#f97316','#8b5cf6'];for(let i=0;i<80;i++)cp.push({x:innerWidth/2+(Math.random()-.5)*300,y:innerHeight*.38,vx:(Math.random()-.5)*10,vy:-7-Math.random()*9,sz:6+Math.random()*8,col:cols[~~(Math.random()*cols.length)],rot:Math.random()*360,rv:(Math.random()-.5)*14,life:1});requestAnimationFrame(animCf);}
    function animCf(){cfX.clearRect(0,0,cfC.width,cfC.height);cp=cp.filter(p=>p.life>.02);for(const p of cp){p.vy+=.38;p.x+=p.vx;p.y+=p.vy;p.rot+=p.rv;p.life-=.018;cfX.save();cfX.globalAlpha=p.life;cfX.translate(p.x,p.y);cfX.rotate(p.rot*Math.PI/180);cfX.fillStyle=p.col;cfX.fillRect(-p.sz/2,-p.sz/2,p.sz,p.sz*.55);cfX.restore();}if(cp.length>0)requestAnimationFrame(animCf);else cfX.clearRect(0,0,cfC.width,cfC.height);}

    /* ── Game state ── */
    let score=0, streak=0, level=1;
    let slotCount=3;
    let slotOrient=[];     // orientation per slot: 'NS' (N left, S right) or 'SN'; null if empty
    let dragOrient=null;   // orientation of tile currently being dragged
    let dragTileWrap=null;
    let locked=false;

    function slotsForLevel(lv){
      if(lv<=1) return 3;
      if(lv===2) return 4;
      if(lv===3) return 5;
      return 6;
    }

    function poolSizeForSlots(n){ return n + 2; } // a couple extra magnets so it's not trivial

    /* ── Build a round ── */
    function newRound(){
      locked=false;
      slotCount=slotsForLevel(level);
      slotOrient=new Array(slotCount).fill(null);

      document.getElementById('level').textContent=level;
      document.getElementById('next-btn').style.display='none';
      document.getElementById('card').classList.remove('solved');
      setMsg('¡ARRASTRA LOS IMANES Y ÚSALOS PARA QUE SE ATRAIGAN!','');

      renderChain();
      renderPool();
    }

    function resetRound(){
      if(locked) return;
      slotOrient=new Array(slotCount).fill(null);
      setMsg('¡ARRASTRA LOS IMANES Y ÚSALOS PARA QUE SE ATRAIGAN!','');
      renderChain();
      renderPool();
    }

    function nextRound(){
      level++;
      newRound();
    }

    /* ── Render magnet DOM (used both in pool and slots) ── */
    function makeMagnetEl(orient, extraCls){
      const m=el('div','magnet'+(extraCls?' '+extraCls:''));
      const left=el('div','magnet-half '+(orient[0]),orient[0]);
      const right=el('div','magnet-half '+(orient[1]),orient[1]);
      m.appendChild(left); m.appendChild(right);
      return m;
    }

    /* ── Render the slot chain + junction indicators ── */
    function renderChain(){
      const row=document.getElementById('chain-row');
      row.innerHTML='';

      for(let i=0;i<slotCount;i++){
        if(i>0){
          row.appendChild(makeJunction(i-1,i));
        }
        row.appendChild(makeSlot(i));
      }
      updateJunctions();
    }

    function makeSlot(i){
      const slot=el('div','slot'+(slotOrient[i]?' filled':''));
      slot.dataset.index=i;
      slot.addEventListener('dragover', e=>{ e.preventDefault(); if(!locked) slot.classList.add('drag-over'); });
      slot.addEventListener('dragleave', ()=>slot.classList.remove('drag-over'));
      slot.addEventListener('drop', e=>onDrop(e,i));

      if(slotOrient[i]){
        const mag=makeMagnetEl(slotOrient[i]);
        mag.addEventListener('click', ()=>{
          if(locked) return;
          slotOrient[i]=flip(slotOrient[i]);
          renderChain();
        });
        slot.appendChild(mag);
      }
      return slot;
    }

    function makeJunction(a,b){
      const j=el('div','junction');
      j.dataset.a=a; j.dataset.b=b;
      j.textContent='';
      return j;
    }

    function flip(o){ return o==='NS' ? 'SN' : 'NS'; }

    /* touching pole between slot a (right end) and slot b (left end) */
    function junctionOk(a,b){
      if(!slotOrient[a] || !slotOrient[b]) return null;
      const rightOfA = slotOrient[a][1];
      const leftOfB  = slotOrient[b][0];
      return rightOfA !== leftOfB; // opposite poles => attract => ok
    }

    function updateJunctions(){
      const junctions=document.querySelectorAll('.junction');
      let allFilled = slotOrient.every(o=>o!==null);
      let allOk = true;
      junctions.forEach(j=>{
        const a=+j.dataset.a, b=+j.dataset.b;
        const ok=junctionOk(a,b);
        j.classList.remove('ok','bad');
        if(ok===null){ j.textContent=''; allOk=false; }
        else if(ok){ j.textContent='✨'; j.classList.add('ok'); }
        else { j.textContent='⚡'; j.classList.add('bad'); allOk=false; }
      });

      if(allFilled && allOk && !locked){
        onSolved();
      } else if(allFilled && !allOk){
        // shake bad junctions
        document.querySelectorAll('.junction.bad').forEach(j=>{
          j.classList.remove('shake'); void j.offsetWidth; j.classList.add('shake');
        });
        streak=0;
        document.getElementById('streak').textContent=streak;
        setMsg('⚡ ¡ESOS POLOS SE REPELEN! CAMBIA EL IMÁN O GÍRALO','bad');
      }
    }

    /* ── Pool of draggable magnets ── */
    function renderPool(){
      const tilesEl=document.getElementById('tiles');
      tilesEl.innerHTML='';
      const n=poolSizeForSlots(slotCount);
      const orients=Array.from({length:n},()=> Math.random()<0.5 ? 'NS':'SN');

      orients.forEach((o,i)=>{
        const wrap=el('div','tile-wrap');
        wrap.dataset.id=String(i);
        const mag=makeMagnetEl(o);
        mag.draggable=true;
        mag.addEventListener('dragstart', e=>{
          if(locked) return;
          dragOrient=o;
          dragTileWrap=wrap;
          mag.classList.add('dragging');
          e.dataTransfer.effectAllowed='move';
          e.dataTransfer.setData('text/plain', String(i));
        });
        mag.addEventListener('dragend', ()=>mag.classList.remove('dragging'));
        mag.addEventListener('click', ()=>{
          if(locked || wrap.classList.contains('used')) return;
          orients[i]=flip(orients[i]);
          wrap.replaceChild(makeMagnetEl(orients[i]), wrap.querySelector('.magnet'));
          // re-bind events by re-rendering this single tile
          rebindTile(wrap, orients, i);
        });
        wrap.appendChild(mag);
        wrap.appendChild(el('div','tile-hint','clic para girar'));
        tilesEl.appendChild(wrap);
      });

      // stash orients on the pool element for onDrop lookups
      tilesEl._orients = orients;
    }

    function rebindTile(wrap, orients, i){
      const mag=wrap.querySelector('.magnet');
      mag.draggable=true;
      mag.addEventListener('dragstart', e=>{
        if(locked) return;
        dragOrient=orients[i];
        dragTileWrap=wrap;
        mag.classList.add('dragging');
        e.dataTransfer.effectAllowed='move';
        e.dataTransfer.setData('text/plain', String(i));
      });
      mag.addEventListener('dragend', ()=>mag.classList.remove('dragging'));
      mag.addEventListener('click', ()=>{
        if(locked || wrap.classList.contains('used')) return;
        orients[i]=flip(orients[i]);
        wrap.replaceChild(makeMagnetEl(orients[i]), wrap.querySelector('.magnet'));
        rebindTile(wrap, orients, i);
      });
    }

    /* ── Drop handler ── */
    function onDrop(e, slotIndex){
      e.preventDefault();
      const slotEl=document.querySelector(`.slot[data-index="${slotIndex}"]`);
      if(slotEl) slotEl.classList.remove('drag-over');
      if(!dragOrient || locked) return;

      // if slot already occupied, just overwrite (previous magnet returns implicitly since pool is regenerated fresh each drop is not ideal —
      // instead: free the old slot value back to null and re-render)
      slotOrient[slotIndex]=dragOrient;
      if(dragTileWrap) dragTileWrap.classList.add('used');
      dragOrient=null; dragTileWrap=null;

      renderChain();
      const newMag=document.querySelector(`.slot[data-index="${slotIndex}"] .magnet`);
      if(newMag) newMag.classList.add('new');
    }

    /* ── Solved! ── */
    function onSolved(){
      locked=true;
      document.getElementById('card').classList.add('solved');

      streak++;
      const bonus = streak>=3 ? 20 : 10;
      score+=bonus;
      document.getElementById('score').textContent=score;
      document.getElementById('streak').textContent=streak;

      const msg = streak>=3
        ? `⭐ ¡GENIAL! RACHA DE ${streak}! +${bonus} PTS`
        : `🧲 ¡POLOS OPUESTOS SE ATRAEN! ¡CADENA COMPLETA! +${bonus} PTS`;
      setMsg(msg,'solved');

      // snap pulse animation down the chain
      const mags=[...document.querySelectorAll('.slot .magnet')];
      mags.forEach((m,i)=>{
        setTimeout(()=>{ m.classList.add('snap'); }, i*120);
      });

      burst();
      document.getElementById('next-btn').style.display='inline-block';
    }

    function setMsg(t,c){const e=document.getElementById('message');e.textContent=t;e.className=c;}
    function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}

    newRound();
  </script>
</body>
</html>
