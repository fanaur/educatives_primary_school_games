<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ordena los Planetas – MicaGames</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      background:#05050f;
      min-height:100vh;
      display:flex; flex-direction:column; align-items:center;
      font-family:'Arial Rounded MT Bold', Arial, sans-serif;
      overflow-y:auto; overflow-x:hidden;
      user-select:none;
    }

    canvas#bg { position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; }

    #game {
      position:relative; z-index:1;
      display:flex; flex-direction:column;
      align-items:center; gap:18px;
      padding:18px 14px 40px;
      width:100%; max-width:900px;
    }

    /* ── Top bar ── */
    #topbar { display:flex; align-items:center; gap:14px; width:100%; }
    .home-btn {
      text-decoration:none;
      background:rgba(255,255,255,0.08);
      border:2px solid rgba(255,255,255,0.15);
      border-radius:50%; width:44px; height:44px;
      display:flex; align-items:center; justify-content:center; font-size:1.3rem;
      transition:border-color .15s, background .15s;
    }
    .home-btn:hover { border-color:#FFD700; background:rgba(255,215,0,.1); }
    .page-title {
      color:#FFD700; font-size:20px;
      text-shadow:0 0 20px rgba(255,215,0,.4), 2px 2px 0 #b8860b;
      letter-spacing:1px;
    }

    /* ── HUD ── */
    #hud { display:flex; gap:28px; align-items:center; }
    .hud-box { text-align:center; }
    .hud-label { color:#64748b; font-size:11px; letter-spacing:2px; text-transform:uppercase; }
    .hud-value { color:#FFD700; font-size:26px; font-weight:bold; text-shadow:0 0 14px rgba(255,215,0,.4); }

    /* ── Message ── */
    #message {
      font-size:16px; font-weight:bold; letter-spacing:1px;
      min-height:24px; text-align:center; color:#e2e8f0;
    }
    #message.correct { color:#22c55e; text-shadow:0 0 12px rgba(34,197,94,.5); }
    #message.wrong   { color:#ef4444; text-shadow:0 0 12px rgba(239,68,68,.5); }
    #message.win     { color:#FFD700; text-shadow:0 0 16px rgba(255,215,0,.7); font-size:19px; }

    /* ── Solar system stage ── */
    #stage {
      position: relative;
      width: 100%;
      max-width: 820px;
      aspect-ratio: 16 / 10;
      background: radial-gradient(circle at 50% 50%, rgba(139,92,246,0.06), transparent 70%);
      border: 2px solid rgba(255,255,255,.08);
      border-radius: 24px;
      overflow: hidden;
    }

    .orbit-ring {
      position:absolute; top:50%; left:50%;
      border:1px dashed rgba(255,255,255,.10);
      border-radius:50%;
      transform:translate(-50%,-50%);
      pointer-events:none;
    }

    .sun {
      position:absolute; top:50%; left:50%;
      transform:translate(-50%,-50%);
      width:54px; height:54px; border-radius:50%;
      background: radial-gradient(circle at 35% 35%, #fff9c4, #FFD700 45%, #F59E0B 80%);
      box-shadow: 0 0 40px 12px rgba(255,215,0,.55);
      z-index: 5;
      animation: sunPulse 3s ease-in-out infinite;
    }
    @keyframes sunPulse {
      0%,100% { box-shadow: 0 0 40px 12px rgba(255,215,0,.55); }
      50%      { box-shadow: 0 0 52px 18px rgba(255,215,0,.75); }
    }

    /* Orbiting container: rotates around the sun's center */
    .orbit-pivot {
      position:absolute; top:50%; left:50%;
      width:0; height:0;
      transform:translate(-50%,-50%);
      z-index:4;
    }
    .orbit-pivot.spinning { animation: spin linear infinite; }
    @keyframes spin { from { transform:translate(-50%,-50%) rotate(0deg); } to { transform:translate(-50%,-50%) rotate(360deg); } }

    .planet-dot {
      position:absolute;
      border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      font-size: 1.4rem;
      box-shadow: 0 0 14px rgba(0,0,0,.5);
      transition: transform .2s;
    }
    .planet-dot .counter-spin {
      display:inline-block;
    }

    /* ── Answer slots row (numbered 1-8 from the sun) ── */
    #slots-row {
      display:flex; gap:8px; flex-wrap:wrap; justify-content:center;
      width:100%;
    }
    .slot {
      width:64px; height:78px;
      border:3px dashed rgba(255,255,255,.22);
      border-radius:14px;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:4px;
      background:rgba(255,255,255,.03);
      transition: background .15s, border-color .15s, transform .1s;
    }
    .slot .slot-num {
      font-size:11px; color:#64748b; letter-spacing:1px;
    }
    .slot .slot-emoji { font-size:1.7rem; }
    .slot.drag-over { border-color:#FFD700; border-style:solid; background:rgba(255,215,0,.14); transform:scale(1.08); }
    .slot.filled { border-style:solid; border-color:#22c55e; background:rgba(34,197,94,.15); }
    .slot.shake { animation: shake .4s ease; }
    @keyframes shake {
      0%,100%{ transform:translateX(0); }
      20%{ transform:translateX(-8px); } 40%{ transform:translateX(8px); }
      60%{ transform:translateX(-5px); } 80%{ transform:translateX(5px); }
    }

    /* ── Planet tiles (draggable pool) ── */
    #tiles {
      display:flex; gap:12px; flex-wrap:wrap; justify-content:center;
      max-width:640px;
    }
    .tile {
      width:76px; height:88px;
      border-radius:16px;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:4px;
      cursor:grab;
      box-shadow: 0 4px 16px rgba(0,0,0,.4);
      transition: transform .12s, opacity .15s, box-shadow .12s;
      border: 2px solid rgba(255,255,255,.15);
    }
    .tile:hover { transform:scale(1.08) translateY(-4px); box-shadow:0 8px 22px rgba(0,0,0,.5); }
    .tile.dragging { opacity:.3; cursor:grabbing; }
    .tile.used { visibility:hidden; pointer-events:none; }
    .tile .tile-emoji { font-size:1.9rem; }
    .tile .tile-name { font-size:10px; color:#fff; font-weight:bold; letter-spacing:.5px; text-align:center; }

    /* ── Next / restart button ── */
    #next-btn, #restart-btn {
      display:none; padding:13px 40px;
      font-size:1.1rem; font-family:inherit; font-weight:bold; color:#1a1a1a;
      background:linear-gradient(90deg,#FFD700,#F59E0B);
      border:none; border-radius:50px; cursor:pointer;
      box-shadow:0 5px 22px rgba(255,215,0,.4); transition:transform .12s;
    }
    #next-btn:hover, #restart-btn:hover { transform:scale(1.07); }

    .confetti-layer { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:50; }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>
  <canvas id="confetti-canvas" class="confetti-layer"></canvas>

  <div id="game">
    <div id="topbar">
      <a class="home-btn" href="index.html">🏠</a>
      <span class="page-title">🪐 ORDENA LOS PLANETAS</span>
    </div>

    <div id="hud">
      <div class="hud-box">
        <div class="hud-label">Puntos</div>
        <div class="hud-value" id="score">0</div>
      </div>
      <div class="hud-box">
        <div class="hud-label">Planetas</div>
        <div class="hud-value" id="progress">0 / 8</div>
      </div>
    </div>

    <div id="message">¡ARRASTRA CADA PLANETA A SU LUGAR, DEL MÁS CERCA AL MÁS LEJOS DEL SOL!</div>

    <div id="stage"></div>

    <div id="slots-row"></div>

    <div id="tiles"></div>

    <button id="restart-btn" onclick="startGame()">🔄 JUGAR DE NUEVO</button>
  </div>

  <script>
    /* ── Starfield ── */
    const bgC=document.getElementById('bg'),bgX=bgC.getContext('2d');
    function rbg(){bgC.width=innerWidth;bgC.height=innerHeight;}
    rbg();window.addEventListener('resize',rbg);
    const stars=Array.from({length:220},()=>({x:Math.random(),y:Math.random(),r:.5+Math.random()*1.6,sp:.00008+Math.random()*.00015,tw:Math.random()*Math.PI*2}));
    function drawBg(){const W=bgC.width,H=bgC.height;bgX.fillStyle='#05050f';bgX.fillRect(0,0,W,H);for(const s of stars){s.tw+=s.sp*60;bgX.globalAlpha=.4+Math.sin(s.tw)*.4;bgX.fillStyle='#fff';bgX.beginPath();bgX.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);bgX.fill();}bgX.globalAlpha=1;requestAnimationFrame(drawBg);}
    drawBg();

    /* ── Confetti ── */
    const cfC=document.getElementById('confetti-canvas'),cfX=cfC.getContext('2d');
    cfC.width=innerWidth;cfC.height=innerHeight;
    window.addEventListener('resize',()=>{cfC.width=innerWidth;cfC.height=innerHeight;});
    let cp=[];
    function burst(){const cols=['#FFD700','#22c55e','#3b82f6','#ec4899','#f97316','#8b5cf6'];for(let i=0;i<80;i++)cp.push({x:innerWidth/2+(Math.random()-.5)*300,y:innerHeight*.35,vx:(Math.random()-.5)*10,vy:-7-Math.random()*9,sz:6+Math.random()*8,col:cols[~~(Math.random()*cols.length)],rot:Math.random()*360,rv:(Math.random()-.5)*14,life:1});requestAnimationFrame(animCf);}
    function animCf(){cfX.clearRect(0,0,cfC.width,cfC.height);cp=cp.filter(p=>p.life>.02);for(const p of cp){p.vy+=.38;p.x+=p.vx;p.y+=p.vy;p.rot+=p.rv;p.life-=.018;cfX.save();cfX.globalAlpha=p.life;cfX.translate(p.x,p.y);cfX.rotate(p.rot*Math.PI/180);cfX.fillStyle=p.col;cfX.fillRect(-p.sz/2,-p.sz/2,p.sz,p.sz*.55);cfX.restore();}if(cp.length>0)requestAnimationFrame(animCf);else cfX.clearRect(0,0,cfC.width,cfC.height);}

    /* ── The 8 planets, in correct order from the Sun ── */
    const PLANETS = [
      { name:'MERCURIO', emoji:'🪨', color:'#a8a29e', orbitR:70,  speed:8  },
      { name:'VENUS',    emoji:'🟠', color:'#f59e0b', orbitR:100, speed:12 },
      { name:'TIERRA',   emoji:'🌍', color:'#3b82f6', orbitR:130, speed:16 },
      { name:'MARTE',    emoji:'🔴', color:'#ef4444', orbitR:160, speed:20 },
      { name:'JÚPITER',  emoji:'🟤', color:'#d97706', orbitR:195, speed:26 },
      { name:'SATURNO',  emoji:'🪐', color:'#eab308', orbitR:230, speed:32 },
      { name:'URANO',    emoji:'🔵', color:'#22d3ee', orbitR:262, speed:38 },
      { name:'NEPTUNO',  emoji:'🔷', color:'#6366f1', orbitR:292, speed:44 },
    ];

    let score=0, placedCount=0, answered=new Set();
    let dragTile=null;

    /* ── Setup stage: sun + orbit rings + orbit pivots ── */
    function buildStage(){
      const stage=document.getElementById('stage');
      stage.innerHTML='';

      const sun=el('div','sun');
      stage.appendChild(sun);

      /* Scale orbit radii to fit stage size */
      const stageEl = stage;
      const scale = Math.min(1, (stageEl.clientWidth*0.46) / PLANETS[PLANETS.length-1].orbitR);

      PLANETS.forEach((p, i)=>{
        const r = p.orbitR * scale;

        const ring=el('div','orbit-ring');
        ring.style.width=(r*2)+'px';
        ring.style.height=(r*2)+'px';
        stage.appendChild(ring);

        const pivot=el('div','orbit-pivot');
        pivot.id=`pivot-${i}`;
        stage.appendChild(pivot);

        const dot=el('div','planet-dot');
        dot.id=`dot-${i}`;
        dot.style.width='30px'; dot.style.height='30px';
        dot.style.left=r+'px'; dot.style.top='-15px'; /* placed at top of orbit, offset by pivot center */
        dot.style.marginLeft='-15px';
        dot.style.background=p.color;
        dot.style.opacity='0'; /* hidden until correctly placed */
        dot.innerHTML=`<span>${p.emoji}</span>`;
        pivot.appendChild(dot);
      });
    }

    /* ── Slots row (target order, blank at first) ── */
    function buildSlots(){
      const row=document.getElementById('slots-row');
      row.innerHTML='';
      PLANETS.forEach((p,i)=>{
        const slot=el('div','slot');
        slot.dataset.index=i;
        const num=el('div','slot-num', `${i+1}`);
        const emoji=el('div','slot-emoji','');
        slot.appendChild(num);
        slot.appendChild(emoji);
        slot.addEventListener('dragover', e=>{ e.preventDefault(); if(!answered.has(i)) slot.classList.add('drag-over'); });
        slot.addEventListener('dragleave', ()=>slot.classList.remove('drag-over'));
        slot.addEventListener('drop', e=>onDrop(e, slot, i));
        row.appendChild(slot);
      });
    }

    /* ── Draggable tiles (shuffled) ── */
    function buildTiles(){
      const cont=document.getElementById('tiles');
      cont.innerHTML='';
      const shuffled = PLANETS.map((p,i)=>({...p, idx:i})).sort(()=>Math.random()-.5);
      shuffled.forEach(p=>{
        const tile=el('div','tile');
        tile.draggable=true;
        tile.dataset.idx=p.idx;
        tile.style.background=`linear-gradient(145deg, ${p.color}, #00000055)`;
        const emoji=el('div','tile-emoji',p.emoji);
        const name=el('div','tile-name',p.name);
        tile.appendChild(emoji); tile.appendChild(name);

        tile.addEventListener('dragstart', e=>{
          dragTile=tile;
          tile.classList.add('dragging');
          e.dataTransfer.effectAllowed='move';
        });
        tile.addEventListener('dragend', ()=>tile.classList.remove('dragging'));

        cont.appendChild(tile);
      });
    }

    /* ── Handle a drop into a slot ── */
    function onDrop(e, slot, slotIdx){
      e.preventDefault();
      slot.classList.remove('drag-over');
      if(!dragTile || answered.has(slotIdx)) return;

      const tileIdx = parseInt(dragTile.dataset.idx);

      if(tileIdx === slotIdx){
        /* Correct! */
        answered.add(slotIdx);
        placedCount++;

        slot.classList.add('filled');
        slot.querySelector('.slot-emoji').textContent = PLANETS[slotIdx].emoji;

        dragTile.classList.add('used');

        score += 15;
        document.getElementById('score').textContent=score;
        document.getElementById('progress').textContent=`${placedCount} / 8`;

        setMsg(`✅ ¡CORRECTO! ${PLANETS[slotIdx].name} EN SU LUGAR`,'correct');
        burst();

        /* Reveal this planet and set it orbiting the sun */
        launchOrbit(slotIdx);

        if(placedCount === PLANETS.length){
          setTimeout(()=>{
            setMsg('🏆 ¡COMPLETASTE EL SISTEMA SOLAR! ¡TODOS LOS PLANETAS ORBITAN!','win');
            document.getElementById('restart-btn').style.display='inline-block';
            burst();
          }, 700);
        }
      } else {
        /* Wrong slot */
        slot.classList.add('shake');
        slot.addEventListener('animationend', ()=>slot.classList.remove('shake'), {once:true});
        setMsg('❌ ¡ESE NO ES SU LUGAR! INTÉNTALO DE NUEVO','wrong');
        setTimeout(()=>setMsg('¡ARRASTRA CADA PLANETA A SU LUGAR, DEL MÁS CERCA AL MÁS LEJOS DEL SOL!',''), 1000);
      }
      dragTile=null;
    }

    /* ── Reveal a planet dot and start its orbit animation ── */
    function launchOrbit(idx){
      const dot=document.getElementById(`dot-${idx}`);
      const pivot=document.getElementById(`pivot-${idx}`);
      dot.style.opacity='1';
      dot.style.transition='opacity .4s';
      pivot.classList.add('spinning');
      pivot.style.animationDuration = PLANETS[idx].speed + 's';
    }

    /* ── Start / restart ── */
    function startGame(){
      score=0; placedCount=0; answered=new Set();
      document.getElementById('score').textContent='0';
      document.getElementById('progress').textContent='0 / 8';
      document.getElementById('restart-btn').style.display='none';
      setMsg('¡ARRASTRA CADA PLANETA A SU LUGAR, DEL MÁS CERCA AL MÁS LEJOS DEL SOL!','');

      buildStage();
      buildSlots();
      buildTiles();
    }

    function setMsg(t,c){ const e=document.getElementById('message'); e.textContent=t; e.className=c; }
    function el(tag,cls,txt){ const e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e; }

    window.addEventListener('resize', ()=>{
      /* Rebuild stage layout on resize, preserving already-placed planets */
      const wasPlaced=[...answered];
      buildStage();
      wasPlaced.forEach(i=>launchOrbit(i));
    });

    startGame();
  </script>
</body>
</html>
